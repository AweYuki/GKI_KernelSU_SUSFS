name: "Apply Networking Enhancements"
description: "Apply BBRv3, IPSet, Qdisc, WireGuard, and CIFS enhancements"

inputs:
  android_version:
    required: true
    type: string
  kernel_version:
    required: true
    type: string
  os_patch_level:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Apply networking enhancements (BBRv3 / IPSet / Qdisc / CIFS)
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail

        BBR3_DIR="$KERNEL_PATCHES/common/bbrv3"
        KVER="${{ inputs.kernel_version }}"
        AVER="${{ inputs.android_version }}"

        # ---------- BBRv3 patch: dispatch by version (from WildKernels/kernel_patches) ----------
        case "$AVER-$KVER" in
          android12-5.10) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch" ;;
          android13-5.15) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android13-5.15.patch" ;;
          android14-6.1)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" ;;
          android15-6.6)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch" ;;
          *) BBR3_PATCH="" ;;
        esac

        # LTS branches continuously merge stable fixes, so context diverges from monthly branches;
        # use the matching -lts patch on LTS builds when available.
        if [ -n "$BBR3_PATCH" ] && [ "${{ inputs.os_patch_level }}" = "lts" ] && [ -f "${BBR3_PATCH%.patch}-lts.patch" ]; then
          BBR3_PATCH="${BBR3_PATCH%.patch}-lts.patch"
        fi

        # No upstream backport patch exists for android16-6.12; keep baseline BBR v1 only
        if [ -n "$BBR3_PATCH" ]; then
          if [ ! -f "$BBR3_PATCH" ]; then
            echo "::error::BBRv3 patch not found: $BBR3_PATCH" >&2
            exit 1
          fi
          echo "[*] Using BBRv3 patch: $(basename "$BBR3_PATCH")"
          if patch -p1 --dry-run < "$BBR3_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH"
            echo "[+] Applied BBRv3 patch"
          else
            echo "::error::Failed to apply BBRv3 patch; keeping .rej files for Rejects artifact analysis" >&2
            patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH" || true
            exit 1
          fi

          RAW_SUB="$ACTUAL_SUBLEVEL"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB
          if [ "$AVER-$KVER" = "android13-5.15" ] && [ "$CURRENT_SUB" -le 43 ]; then
            patch -p1 --forward < "$GITHUB_WORKSPACE/patches/bbrv3/0002-net-tcp-add-tcp_snd_cwnd-and-tcp_snd_cwnd_set-helper-functions.patch"
            echo "[+] Applied 5.15 <= 43 tcp_snd_cwnd helper prerequisite patch"
          fi
        else
          echo "[*] No BBRv3 backport for $AVER-$KVER, skipping patch"
        fi

        # 5.10 lacks proc_dou8vec_minmax (a 5.15+ sysctl API required by BBRv3); apply the two prerequisite patches
        if [ "$KVER" = "5.10" ] && ! grep -qF 'int proc_dou8vec_minmax(' include/linux/sysctl.h 2>/dev/null; then
          for prepatch in sysctl_add_proc_dou8vec_minmax sysctl_fix_data-races_in_proc_dou8vec_minmax; do
            if patch -p1 --dry-run < "$BBR3_DIR/$prepatch.patch" >/dev/null 2>&1; then
              patch -p1 --no-backup-if-mismatch < "$BBR3_DIR/$prepatch.patch"
            else
              echo "::error::Failed to apply 5.10 sysctl prerequisite patch: $prepatch" >&2
              exit 1
            fi
          done
          echo "[+] Applied 5.10 sysctl prerequisite patches"
        fi

        set_config() {
          local key="$1" value="$2"
          if grep -q "^$key=" "$DEFCONFIG"; then
            sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
          elif grep -q "^# $key is not set" "$DEFCONFIG"; then
            sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
          else
            echo "$key=$value" >> "$DEFCONFIG"
          fi
        }

        # Full IPSet suite + netfilter integration
        for cfg in IP_SET IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC IP_SET_BITMAP_PORT \
          IP_SET_HASH_IP IP_SET_HASH_IPMARK IP_SET_HASH_IPPORT IP_SET_HASH_IPPORTIP \
          IP_SET_HASH_IPPORTNET IP_SET_HASH_IPMAC IP_SET_HASH_MAC \
          IP_SET_HASH_NETPORTNET IP_SET_HASH_NET IP_SET_HASH_NETNET \
          IP_SET_HASH_NETPORT IP_SET_HASH_NETIFACE IP_SET_LIST_SET \
          NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_SET NETFILTER_XT_TARGET_LOG \
          NETFILTER_XT_MATCH_RECENT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE \
          IP_NF_TARGET_REJECT IP6_NF_TARGET_REJECT; do
          set_config "CONFIG_$cfg" y
        done
        set_config CONFIG_IP_SET_MAX 65534
        if [ "$KVER" = "5.10" ]; then
          sed -i 's/CONFIG_IP_SET_MAX/65534/g' net/netfilter/ipset/ip_set_core.c
        fi

        # TCP congestion control algorithms: default to bbr3 when BBRv3 is patched, otherwise bbr
        for cfg in TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_CUBIC \
          TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP; do
          set_config "CONFIG_$cfg" y
        done
        if [ -n "$BBR3_PATCH" ]; then
          set_config CONFIG_TCP_CONG_BBR3 y
          set_config CONFIG_DEFAULT_BBR3 y
          set_config CONFIG_DEFAULT_TCP_CONG '"bbr3"'
        else
          set_config CONFIG_DEFAULT_BBR y
          set_config CONFIG_DEFAULT_TCP_CONG '"bbr"'
        fi

        # Traffic shaping Qdisc + connection mark + TTL/HopLimit + WireGuard
        for cfg in NET_SCH_FQ NET_SCH_FQ_CODEL NET_SCH_CAKE NET_ACT_CONNMARK \
          IP_NF_TARGET_TTL IP6_NF_TARGET_HL IP6_NF_MATCH_HL WIREGUARD; do
          set_config "CONFIG_$cfg" y
        done

        # CIFS network filesystem
        for cfg in CIFS NETWORK_FILESYSTEMS KEYS CIFS_XATTR CIFS_POSIX; do
          set_config "CONFIG_$cfg" y
        done

        # On 6.12+, remove fs/netfs/netfs.ko from Kleaf GKI module lists once NETFS becomes built-in
        if [ "$AVER" = "android16" ]; then
          python3 "$GITHUB_WORKSPACE/scripts/build_helpers/cifs_modules_fix.py" "$PWD" fs/netfs/netfs.ko
        fi

        echo "[+] Networking enhancements configured"
