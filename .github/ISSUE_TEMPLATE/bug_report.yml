name: "Bug Report / Báo lỗi"
description: "Report a bug / Báo cáo lỗi"
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Please fill in the following information / Vui lòng điền các thông tin dưới đây**

  - type: textarea
    id: description
    attributes:
      label: "Bug Description / Mô tả lỗi"
      description: "Describe the bug clearly / Mô tả rõ ràng lỗi bạn gặp phải"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to Reproduce / Các bước tái hiện"
      description: "How to reproduce this issue / Làm thế nào để tái hiện vấn đề này"
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: device
    attributes:
      label: "Device Info / Thông tin thiết bị"
      description: "Your device and kernel info / Thông tin thiết bị và kernel của bạn"
      value: |
        - Device / Thiết bị:
        - Android Version / Phiên bản Android:
        - Kernel Version / Phiên bản Kernel:
        - KernelSU Version / Phiên bản KernelSU:
        - SUSFS Version / Phiên bản SUSFS:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs / Nhật ký"
      description: "Relevant logs or screenshots / Nhật ký hoặc ảnh chụp màn hình liên quan"
      render: shell
