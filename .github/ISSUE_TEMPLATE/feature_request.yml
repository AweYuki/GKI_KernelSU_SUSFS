name: "Feature Request / Yêu cầu tính năng"
description: "Suggest a feature / Đề xuất tính năng mới"
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        **Please describe your request / Vui lòng mô tả yêu cầu của bạn**

  - type: textarea
    id: feature
    attributes:
      label: "Feature Description / Mô tả tính năng"
      description: "Describe the feature you want / Mô tả tính năng bạn mong muốn"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "Use Case / Trường hợp sử dụng"
      description: "Why do you need this feature / Lý do bạn cần tính năng này"

  - type: textarea
    id: additional
    attributes:
      label: "Additional Info / Thông tin bổ sung"
      description: "Any other context, links or screenshots / Ngữ cảnh, liên kết hoặc ảnh chụp màn hình khác"
