name: Kernel Build - Android 14 (6.1)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Dropdown Options ====================
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - AweYukiSU
        default: AweYukiSU
      ksu_mode:
        description: "KernelSU / SUSFS mode"
        required: true
        type: choice
        options:
          - "Off"
          - "Disable SUSFS"
          - "Disable KSU"
        default: "Off"
      use_kpm:
        description: "KPM support (patched is not supported yet)"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
          - "patched (not supported yet)"
      droidspaces:
        description: "Droidspaces container support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Artifact upload mode"
        required: true
        type: choice
        options:
          - "Only AnyKernel3.zip"
          - "Upload All"
        default: "Only AnyKernel3.zip"

      # ==================== Text Inputs ====================
      version:
        description: "Custom version string (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build timestamp (optional, N or empty = current UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Toggles (Default Off) ====================
      use_zram:
        description: "Enable enhanced ZRAM algorithms"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable Baseband-guard (BBG)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable NoMount metamodule"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "Enable networking enhancements (BBRv3 / IPSet / Qdisc / CIFS)"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "Enable NTSync kernel driver"
        required: false
        type: boolean
        default: false
      use_usb_arsenal:
        description: "Enable USB Arsenal (USB gadget & HID/MSD/NCM patches)"
        required: false
        type: boolean
        default: false
      use_ptrace:
        description: "Apply GKI ptrace compatibility patch (< 5.16)"
        required: false
        type: boolean
        default: false
      use_perf:
        description: "Apply WildKernels performance & power optimization patches"
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        description: "Bypass module version check (force-load mismatched vendor modules)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: "Off"
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload All"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      use_usb_arsenal:
        required: false
        type: boolean
        default: false
      use_ptrace:
        required: false
        type: boolean
        default: false
      use_perf:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "Whether called from main.yml (internal use)"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "Export integrated SUSFS patches (passed from main.yml)"
        required: false
        type: boolean
        default: false

jobs:
  build-kernels-a14-6-1:
    name: "6.1.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "25"
            os_patch_level: "2023-10"
          - sub_level: "43"
            os_patch_level: "2023-11"
          - sub_level: "57"
            os_patch_level: "2024-01"
          - sub_level: "68"
            os_patch_level: "2024-03"
          - sub_level: "75"
            os_patch_level: "2024-05"
          - sub_level: "78"
            os_patch_level: "2024-06"
          - sub_level: "84"
            os_patch_level: "2024-07"
          - sub_level: "90"
            os_patch_level: "2024-08"
          - sub_level: "93"
            os_patch_level: "2024-09"
          - sub_level: "99"
            os_patch_level: "2024-10"
          - sub_level: "112"
            os_patch_level: "2024-11"
          - sub_level: "115"
            os_patch_level: "2024-12"
          - sub_level: "118"
            os_patch_level: "2025-01"
          - sub_level: "124"
            os_patch_level: "2025-02"
          - sub_level: "128"
            os_patch_level: "2025-03"
          - sub_level: "129"
            os_patch_level: "2025-04"
          - sub_level: "134"
            os_patch_level: "2025-05"
          - sub_level: "138"
            os_patch_level: "2025-06"
          - sub_level: "141"
            os_patch_level: "2025-07"
          - sub_level: "145"
            os_patch_level: "2025-09"
          - sub_level: "157"
            os_patch_level: "2025-12"
          - sub_level: "162"
            os_patch_level: "2026-03"
          - sub_level: "172"
            os_patch_level: "2026-06"
          - sub_level: "176"
            os_patch_level: "2026-09"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || 'Off' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      use_usb_arsenal: ${{ inputs.use_usb_arsenal || false }}
      use_ptrace: ${{ inputs.use_ptrace || false }}
      use_perf: ${{ inputs.use_perf || false }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # Run only when triggered directly; skip when called from main.yml
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
