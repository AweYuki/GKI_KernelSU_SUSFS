# GKI Kernel Build Main Entrypoint
# This workflow is the unified entrypoint of the project, used to:
# 1. Build all GKI kernel versions
# 2. Fetch the latest KSU Manager APK and SUSFS module
# 3. Collect patch reject files and build failure logs for debugging
# 4. Create a GitHub Release (optional)

name: Release Kernel Build

# Concurrency control: run only one instance per branch, cancelling older in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Dropdown Options ====================
      release_type:
        description: "Release type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions
      kernelsu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - AweYukiSU
        default: AweYukiSU
      ksu_mode:
        description: "KernelSU / SUSFS mode"
        type: choice
        options:
          - "Off"
          - "Disable SUSFS"
          - "Disable KSU"
        default: "Off"
      droidspaces:
        description: "Droidspaces container support (5.10~6.6: slot patch, 6.12: on/off)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"

      # ==================== Text Inputs ====================
      version:
        description: "Custom version string (optional)"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom build timestamp (optional, N or empty = current UTC)"
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
        required: false

      # ==================== Toggles (Default On) ====================
      build_all:
        description: "Build all versions"
        type: boolean
        default: true
      export_susfs_patches:
        description: "Collect integrated SUSFS patches"
        type: boolean
        default: true

      # ==================== Toggles (Default Off) ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      use_zram:
        description: "Enable enhanced ZRAM algorithms"
        type: boolean
        default: false
      use_bbg:
        description: "Enable Baseband-guard (BBG)"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        type: boolean
        default: false
      use_nomount:
        description: "Enable NoMount metamodule"
        type: boolean
        default: false
      use_networking:
        description: "Enable networking enhancements (BBRv3 / IPSet / Qdisc / CIFS)"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "Enable NTSync kernel driver"
        type: boolean
        default: false
      use_usb_arsenal:
        description: "Enable USB Arsenal (USB gadget & HID/MSD/NCM patches)"
        type: boolean
        default: false
      use_ptrace:
        description: "Apply GKI ptrace compatibility patch (< 5.16)"
        type: boolean
        default: false
      use_perf:
        description: "Apply WildKernels performance & power optimization patches"
        type: boolean
        default: false
      allow_version_mismatch:
        description: "Bypass module version check (force-load mismatched vendor modules)"
        type: boolean
        default: false

jobs:
  # Download the latest KernelSU Manager APK and SUSFS module
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

  # Generate build matrices dynamically from data/android*/*.json
  prepare-matrices:
    if: inputs.build_all || inputs.build_a12_5_10 || inputs.build_a13_5_15 || inputs.build_a14_6_1 || inputs.build_a15_6_6 || inputs.build_a16_6_12
    runs-on: ubuntu-24.04
    outputs:
      m510: ${{ steps.gen.outputs.m510 }}
      m515: ${{ steps.gen.outputs.m515 }}
      m61: ${{ steps.gen.outputs.m61 }}
      m66: ${{ steps.gen.outputs.m66 }}
      m612: ${{ steps.gen.outputs.m612 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: data

      - name: Build kernel matrices from data JSON
        id: gen
        run: |
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          import json
          specs = [
              ("m510", "data/android12/5.10.json", "2022-01"),
              ("m515", "data/android13/5.15.json", "2023-01"),
              ("m61",  "data/android14/6.1.json",  "2023-10"),
              ("m66",  "data/android15/6.6.json",  "2024-10"),
              ("m612", "data/android16/6.12.json", "2025-06"),
          ]
          for key, path, min_date in specs:
              data = json.load(open(path, encoding="utf-8"))
              include = []
              for v in data.get("entries", []):
                  d = v.get("date", "")
                  k = v.get("kernel", "")
                  if d < min_date:
                      continue
                  sub = k.split(".")[-1]
                  include.append({"sub_level": sub, "os_patch_level": d})
              if data.get("lts"):
                  include.append({"sub_level": "X", "os_patch_level": "lts"})
              print(f"{key}={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

  build-a12-5-10:
    if: inputs.build_a12_5_10 || inputs.build_all
    needs: prepare-matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrices.outputs.m510) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      use_usb_arsenal: ${{ inputs.use_usb_arsenal }}
      use_ptrace: ${{ inputs.use_ptrace }}
      use_perf: ${{ inputs.use_perf }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch }}
      artifact_upload_mode: "Upload All"

  build-a13-5-15:
    if: inputs.build_a13_5_15 || inputs.build_all
    needs: prepare-matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrices.outputs.m515) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      use_usb_arsenal: ${{ inputs.use_usb_arsenal }}
      use_ptrace: ${{ inputs.use_ptrace }}
      use_perf: ${{ inputs.use_perf }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch }}
      artifact_upload_mode: "Upload All"

  build-a14-6-1:
    if: inputs.build_a14_6_1 || inputs.build_all
    needs: prepare-matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrices.outputs.m61) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      use_usb_arsenal: ${{ inputs.use_usb_arsenal }}
      use_ptrace: ${{ inputs.use_ptrace }}
      use_perf: ${{ inputs.use_perf }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch }}
      artifact_upload_mode: "Upload All"

  build-a15-6-6:
    if: inputs.build_a15_6_6 || inputs.build_all
    needs: prepare-matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrices.outputs.m66) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      use_usb_arsenal: ${{ inputs.use_usb_arsenal }}
      use_ptrace: ${{ inputs.use_ptrace }}
      use_perf: ${{ inputs.use_perf }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch }}
      artifact_upload_mode: "Upload All"

  build-a16-6-12:
    if: inputs.build_a16_6_12 || inputs.build_all
    needs: prepare-matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrices.outputs.m612) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      use_usb_arsenal: ${{ inputs.use_usb_arsenal }}
      use_ptrace: ${{ inputs.use_ptrace }}
      use_perf: ${{ inputs.use_perf }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch }}
      artifact_upload_mode: "Upload All"

  # Aggregate .rej files across all build jobs to debug patch conflicts
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download reject files
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Bundle reject files
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload aggregated reject files
        uses: actions/upload-artifact@v7
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # Aggregate failure logs across all build jobs by build name for easier troubleshooting
  collect-build-logs:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download build failure logs
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-build-logs
          pattern: '*-Build-Logs'
          merge-multiple: false

      - name: Bundle build failure logs
        run: |
          mkdir -p aio-build-logs
          found_logs=false
          for dir in ./downloaded-build-logs/*-Build-Logs; do
            [ -d "$dir" ] || continue
            artifact_name=$(basename "$dir")
            mkdir -p "aio-build-logs/$artifact_name"
            cp -r "$dir/." "aio-build-logs/$artifact_name/"
            found_logs=true
          done

          # download-artifact extracts directly into target directory when only a single artifact matches
          if [ "$found_logs" = false ] && [ -f ./downloaded-build-logs/artifact-name.txt ]; then
            read -r artifact_name < ./downloaded-build-logs/artifact-name.txt
            artifact_name=$(basename "$artifact_name")
            if [ -n "$artifact_name" ]; then
              mkdir -p "aio-build-logs/$artifact_name"
              cp -r ./downloaded-build-logs/. "aio-build-logs/$artifact_name/"
            fi
          fi

          if [ "$(ls -A aio-build-logs 2>/dev/null)" ]; then
            cd aio-build-logs
            zip -r -q -9 ../AIO-BUILD-LOGS.zip .
          fi

      - name: Upload aggregated build failure logs
        id: upload_aggregated_build_logs
        uses: actions/upload-artifact@v7
        with:
          name: AIO-BUILD-LOGS
          path: AIO-BUILD-LOGS.zip
          if-no-files-found: ignore

      - name: Delete individual build failure log artifacts
        if: steps.upload_aggregated_build_logs.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove intermediate per-job artifacts once the aggregated bundle is uploaded to save storage
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith("-Build-Logs")) | .id'); then
            echo "::warning::Failed to list individual build failure log artifacts, skipping cleanup"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "Deleted intermediate log artifact: $artifact_id"
            else
              echo "::warning::Failed to delete intermediate log artifact $artifact_id"
            fi
          done <<< "$ARTIFACT_IDS"

  # Aggregate integrated SUSFS patches exported by build jobs into a single zip for Release distribution
  # Produced for AweYukiSU with SUSFS enabled
  collect-susfs-patches:
    if: ${{ !cancelled() && inputs.export_susfs_patches && inputs.ksu_mode == 'Off' && inputs.kernelsu_variant == 'AweYukiSU' }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download integrated SUSFS patches
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-susfs-patches
          pattern: 'SUSFS-Patch-*'
          merge-multiple: false

      - name: Package integrated SUSFS patches
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        run: |
          BUNDLE="susfs-patches"
          mkdir -p "$BUNDLE"
          found=0

          # Archive by manifest fields: android14-6.1/6.1.148-2025-12/
          place_patch() {
            local src="$1" manifest="$src/manifest.json"
            if [ ! -f "$manifest" ] || [ ! -s "$src/susfs.patch" ]; then
              echo "::warning::$src is missing manifest.json or susfs.patch, skipping"
              return 0
            fi
            local android_version kernel_version actual_sublevel os_patch_level
            android_version=$(jq -r '.android_version' "$manifest")
            kernel_version=$(jq -r '.kernel_version' "$manifest")
            actual_sublevel=$(jq -r '.actual_sublevel' "$manifest")
            os_patch_level=$(jq -r '.os_patch_level' "$manifest")
            local dest="$BUNDLE/${android_version}-${kernel_version}/${kernel_version}.${actual_sublevel}-${os_patch_level}"
            mkdir -p "$dest"
            cp "$src/susfs.patch" "$src/manifest.json" "$dest/"
            [ -f "$src/susfs.config" ] && cp "$src/susfs.config" "$dest/"
            found=$((found + 1))
          }

          for dir in ./downloaded-susfs-patches/SUSFS-Patch-*; do
            [ -d "$dir" ] || continue
            place_patch "$dir"
          done
          # download-artifact extracts directly into target directory when only a single artifact matches
          if [ "$found" -eq 0 ] && [ -f ./downloaded-susfs-patches/manifest.json ]; then
            place_patch ./downloaded-susfs-patches
          fi

          if [ "$found" -eq 0 ]; then
            echo "::warning::No integrated SUSFS patches found to bundle"
            exit 0
          fi
          echo "Bundled $found patch set(s)"

          # Top-level index: merge all manifests sorted by kernel version
          find "$BUNDLE" -name manifest.json -print0 | sort -z | xargs -0 jq -s \
            --arg ksu_variant "$KSU_VARIANT" \
            --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              ksu_variant: $ksu_variant,
              generated_at: $generated_at,
              run_id: $run_id,
              run_url: $run_url,
              count: length,
              patches: (map(. + {
                path: ("\(.android_version)-\(.kernel_version)/\(.kernel_version).\(.actual_sublevel)-\(.os_patch_level)/")
              }) | sort_by(.android_version, (.actual_sublevel | tonumber)))
            }' > "$BUNDLE/index.json"

          cat > "$BUNDLE/README.md" << 'EOF'
          # Integrated SUSFS Patches

          This archive is automatically exported by the GKI_KernelSU_SUSFS build pipeline. Each directory corresponds to a GKI branch and contains the complete `common/` diff between "after adding KernelSU" and "after applying SUSFS patches", including all context fixes required for that branch, verified by a successful kernel build.

          Directory layout: `<android_version>-<kernel_version>/<kernel_version>.<sublevel>-<os_patch_level>/`

          | File | Description |
          |:---|:---|
          | `susfs.patch` | Kernel-side SUSFS patch (`git diff --binary` format) |
          | `susfs.config` | SUSFS defconfig fragment to append to your defconfig |
          | `manifest.json` | Build metadata: GKI branch & commit, KernelSU commit, SUSFS commit, `.rej` count, etc. |
          | `index.json` | Top-level index aggregating all manifests |

          ## Usage

          1. Check that `VERSION`, `PATCHLEVEL`, and `SUBLEVEL` in your kernel source `Makefile` match the directory name. If there is no exact match, try the closest sublevel first.
          2. From the parent directory of your kernel tree (parent of `common/`), run `ksu_setup_cmd` recorded in `manifest.json` to add KernelSU at the exact recorded commit hash. The patch is paired with that KernelSU commit — do not switch to another branch.
          3. Enter `common/` and apply the patch:

             ```bash
             git apply -3 /path/to/susfs.patch
             # Fallback if the source tree is not a git repository:
             patch -p1 < /path/to/susfs.patch
             ```

          4. Append `susfs.config` to your defconfig (`arch/arm64/configs/gki_defconfig` for GKI):

             ```bash
             cat /path/to/susfs.config >> arch/arm64/configs/gki_defconfig
             ```

          5. Enable `CONFIG_KSU` and other required options per the KernelSU documentation, then build as usual.

          ## Notes

          - These patches are verified against pure GKI source trees. OEM kernels based on GKI may produce `.rej` conflicts if `fs/`, `security/`, or other subsystems were modified, requiring manual resolution. Three-way merge (`git apply -3`) resolves most context offsets automatically.
          - When KernelSU is pinned to a specific commit, its own version code and version string are computed at build time by its `Kbuild` and may display the latest branch count or `@HEAD`; this is expected upstream behavior.
          - Using a different KernelSU commit than `ksu_commit` in `manifest.json` will often still compile, but full functionality is not guaranteed.
          EOF

          cd "$BUNDLE"
          zip -r -q -9 "../SUSFS-Patches-${KSU_VARIANT}.zip" .
          cd ..
          echo "SUSFS_PATCHES_ZIP=SUSFS-Patches-${KSU_VARIANT}.zip" >> $GITHUB_ENV

      - name: Upload aggregated SUSFS patches
        id: upload_aggregated_susfs_patches
        if: env.SUSFS_PATCHES_ZIP != ''
        uses: actions/upload-artifact@v7
        with:
          name: SUSFS-Patches-${{ inputs.kernelsu_variant }}
          path: ${{ env.SUSFS_PATCHES_ZIP }}
          if-no-files-found: ignore

      - name: Delete individual SUSFS patch artifacts
        if: steps.upload_aggregated_susfs_patches.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove intermediate per-job artifacts once the aggregated bundle is uploaded to save storage
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("SUSFS-Patch-")) | .id'); then
            echo "::warning::Failed to list individual SUSFS patch artifacts, skipping cleanup"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "Deleted intermediate patch artifact: $artifact_id"
            else
              echo "::warning::Failed to delete intermediate patch artifact $artifact_id"
            fi
          done <<< "$ARTIFACT_IDS"

  # Create a GitHub Release when release_type is not Actions
  # Runs only on the main repository; skipped on forks
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' && github.repository == 'AweYuki/GKI_KernelSU_SUSFS' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    needs:
      - get-manager
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - collect-susfs-patches

    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN }}

    steps:
      - name: Set display metadata
        run: |
          # KSU display name
          KSU_NAME="AweYukiSU"
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # Version info
          KSU_VER="${{ needs.get-manager.outputs.ksuVer }}"
          SUS_VER="${{ needs.get-manager.outputs.susVer }}"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "SUS_VER=$SUS_VER" >> $GITHUB_ENV

          # Feature toggle badges
          echo "LZ4_STATUS=${{ inputs.use_zram && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "NET_STATUS=${{ inputs.use_networking && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "USBA_STATUS=${{ inputs.use_usb_arsenal && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "PTRACE_STATUS=${{ inputs.use_ptrace && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "PERF_STATUS=${{ inputs.use_perf && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "NOMOUNT_STATUS=${{ inputs.use_nomount && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "NTSYNC_STATUS=${{ inputs.droidspaces_ntsync && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV

          # Hook & mount types (AweYukiSU)
          echo "HOOK_TYPE=SUSFS Inline Hooks" >> $GITHUB_ENV
          echo "MOUNT_TYPE=Magic Mount" >> $GITHUB_ENV

          # Release title and KernelSU / SUSFS mode (later entries in GITHUB_ENV override earlier ones)
          case "${{ inputs.ksu_mode }}" in
            "Disable KSU")
              echo "KSU_NAME=Not integrated" >> $GITHUB_ENV
              echo "KSU_VER=" >> $GITHUB_ENV
              echo "SUS_VER=Not integrated" >> $GITHUB_ENV
              echo "BRANCH_INFO=-" >> $GITHUB_ENV
              echo "HOOK_TYPE=None" >> $GITHUB_ENV
              echo "MOUNT_TYPE=None" >> $GITHUB_ENV
              echo "RELEASE_HEADLINE=**Vanilla GKI Kernel** (without KernelSU / SUSFS)" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: Vanilla (No KernelSU / SUSFS)" >> $GITHUB_ENV
              ;;
            "Disable SUSFS")
              echo "SUS_VER=Not integrated" >> $GITHUB_ENV
              echo "RELEASE_HEADLINE=**${KSU_NAME} ${KSU_VER}** (without SUSFS)" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} (No SUSFS)" >> $GITHUB_ENV
              ;;
            *)
              echo "RELEASE_HEADLINE=**${KSU_NAME} ${KSU_VER}** + **SUSFS ${SUS_VER}**" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} + SUSFS ${SUS_VER}" >> $GITHUB_ENV
              ;;
          esac

      - name: Verify build status
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected build job $job_name failed (result: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_a12_5_10 || inputs.build_all }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_a13_5_15 || inputs.build_all }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_a14_6_1 || inputs.build_all }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_a15_6_6 || inputs.build_all }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_a16_6_12 || inputs.build_all }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve KSU ref
        if: inputs.ksu_mode != 'Disable KSU'
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "AweYukiSU" ]; then
            echo "Error: Unsupported variant ${{ inputs.kernelsu_variant }}" >&2
            exit 1
          fi
          BRANCH="main"
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH_INFO=$BRANCH" >> $GITHUB_ENV

      - name: Fetch KernelSU commit info
        if: inputs.ksu_mode != 'Disable KSU'
        run: |
          REPO_URL="https://github.com/AweYuki/AweYukiSU.git"
          REPO_URL2="AweYuki/AweYukiSU"

          if [ -f "config/config" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2 || true)
            CUSTOM_COMMIT=$(grep "^aweyukisu=" config/config | cut -d'=' -f2 || true)
            if [ "$CUSTOM_ENABLED" = "true" ] && [ -n "$CUSTOM_COMMIT" ]; then
              KSU_REF="$CUSTOM_COMMIT"
              KSU_URL="https://github.com/$REPO_URL2/commit/$CUSTOM_COMMIT"
              echo "BRANCH_INFO=custom" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ]; then
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/${KSU_BRANCH:-main} | awk '{ print $1 }')
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      - name: Fetch SUSFS commit info
        if: inputs.ksu_mode == 'Off'
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      - name: Generate release notes
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi
          if [[ "${{ inputs.ksu_mode }}" == "Disable KSU" ]]; then
            KSU_COMMIT_LINE="- KernelSU is not integrated in this build"
          else
            KSU_COMMIT_LINE="- $KSU_NAME: [\`$KSU_DISPLAY_REF\`]($KSU_URL)"
          fi

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10"
          append_target "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15"
          append_target "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1"
          append_target "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6"
          append_target "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12"
          if [[ -z "$build_targets" ]]; then
            build_targets="Not selected"
          fi

          : > susfs_commits.md
          append_susfs_commit() {
            local selected="$1" label="$2" hash="$3" url="$4"
            if [[ "$selected" == "true" && -n "$hash" && -n "$url" ]]; then
              printf -- '- %s: [`%s`](%s)\n' "$label" "${hash:0:7}" "$url" >> susfs_commits.md
            fi
          }
          append_susfs_commit "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10" "${COMMIT_HASH_gki_android12_5_10}" "${COMMIT_URL_gki_android12_5_10}"
          append_susfs_commit "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15" "${COMMIT_HASH_gki_android13_5_15}" "${COMMIT_URL_gki_android13_5_15}"
          append_susfs_commit "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1" "${COMMIT_HASH_gki_android14_6_1}" "${COMMIT_URL_gki_android14_6_1}"
          append_susfs_commit "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6" "${COMMIT_HASH_gki_android15_6_6}" "${COMMIT_URL_gki_android15_6_6}"
          append_susfs_commit "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12" "${COMMIT_HASH_gki_android16_6_12}" "${COMMIT_URL_gki_android16_6_12}"
          if [[ "${{ inputs.ksu_mode }}" != "Off" ]]; then
            echo "- SUSFS is not integrated in this build" > susfs_commits.md
          elif [[ ! -s susfs_commits.md ]]; then
            echo "- Failed to retrieve SUSFS commit info for this build" > susfs_commits.md
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          $RELEASE_HEADLINE

          | Item | Value |
          |:---|:---|
          | Release Type | ${{ inputs.release_type }} |
          | Build Time | $BUILD_DATE |
          | Build Targets | $build_targets |

          ### Build Configuration

          | Option | Value |
          |:---|:---|
          | KernelSU Variant | $KSU_NAME |
          | KernelSU Branch | $BRANCH_INFO |
          | SUSFS | $SUS_VER |
          | Hook Type | $HOOK_TYPE |
          | Mount System | $MOUNT_TYPE |
          | LTO | thin |
          | Baseband-guard (BBG) | $BBG_STATUS |
          | ZRAM / LZ4KD | $LZ4_STATUS |
          | NoMount | $NOMOUNT_STATUS |
          | Networking (BBRv3 / IPSet / CAKE / CIFS) | $NET_STATUS |
          | USB Arsenal | $USBA_STATUS |
          | NTSync | $NTSYNC_STATUS |
          | GKI Ptrace Patch | $PTRACE_STATUS |
          | Performance Patches | $PERF_STATUS |

          ### Downloads

          Download the matching files from **Assets** below.

          | File Pattern | Purpose |
          |:---|:---|
          | \`*_kernel-*.zip\` | AnyKernel3 flashable kernel package |
          | \`*.img\` | Partition images (\`boot\`, \`vendor_boot\`, etc.) |
          | \`*.apk\` | KernelSU Manager app |
          | \`susfs-*.zip\` | Companion SUSFS module |
          | \`SUSFS-Patches-*.zip\` | Integrated SUSFS patches (AweYukiSU, for custom kernel builds) |

          > [!IMPORTANT]
          > Always back up your stock \`boot\` image before flashing.
          > If your device fails to boot, restore the stock image first and then capture KernelSU logs to report the issue.

          <details>
          <summary>Post-Flashing Guide</summary>

          ### Normal Boot

          After installing or updating the KernelSU Manager app, verify that root access, modules, and SUSFS status are working properly.

          ### Bootloop / Failure to Boot

          1. Restore your stock \`boot\` image
          2. Extract logs via KernelSU Manager or recovery
          3. Open an issue at [Issues](https://github.com/AweYuki/GKI_KernelSU_SUSFS/issues) with your device model, Android version, kernel version, and flashed filename

          </details>

          <details>
          <summary>Upstream Commits</summary>

          **KernelSU**

          $KSU_COMMIT_LINE

          **SUSFS4KSU**

          $(cat susfs_commits.md)

          </details>

          ---

          Recommended module: https://github.com/sidex15/ksu_module_susfs

          For the Unicode zero-width bypass fix, use this Xposed module: https://t.me/real5ec1cff/268
          EOF

      - name: Generate release tag
        run: |
          # Get SUSFS version; fall back to default if get-manager was skipped
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          if [ -z "$SUS_VERSION" ]; then
            echo "Warning: SUSFS version not available, falling back to default version"
            SUS_VERSION="1.0.0"
          fi

          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null | sed 's/-.*//' || echo "")

          if [ "$SUS_VERSION" = "$LATEST_TAG" ]; then
            LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          else
            LATEST_TAG="$SUS_VERSION-r0"
          fi

          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated tag: $NEW_TAG"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$NEW_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG

      - name: Upload Manager APK and SUSFS module
        continue-on-error: true
        run: |
          echo "Preparing to upload APK and SUSFS module..."
          apk_count=$(find ./downloaded-artifacts -type f -name "*.apk" | wc -l || true)
          sus_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" | wc -l || true)
          echo "APK files: ${apk_count}"
          echo "SUSFS files: ${sus_count}"
          find ./downloaded-artifacts -type f -name "*.apk" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done

      # Silently skip if aggregation job was skipped or produced no artifacts
      - name: Upload integrated SUSFS patches
        if: needs.collect-susfs-patches.result == 'success'
        continue-on-error: true
        run: |
          uploaded=0
          for file in ./downloaded-artifacts/SUSFS-Patches-*/SUSFS-Patches-*.zip; do
            [ -f "$file" ] || continue
            echo "Uploading $file..."
            gh release upload "$NEW_TAG" "$file" && uploaded=$((uploaded + 1))
          done
          echo "Uploaded $uploaded integrated SUSFS patch archive(s)"

      - name: Upload kernel artifacts
        run: |
          for file in ./downloaded-artifacts/*_kernel-*/*; do
            [ -d "$file" ] && continue
            # Skip files in -Rejects directories (already aggregated in collect-rejects)
            [[ "$file" == *-Rejects/* ]] && continue
            echo "Uploading $file..."
            gh release upload "$NEW_TAG" "$file"
          done

      - name: Job summary
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
