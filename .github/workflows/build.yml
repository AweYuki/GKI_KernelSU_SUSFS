name: Kernel Build Pipeline

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== Basic Configuration ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU Configuration ====================
      ksu_variant:
        required: false
        type: string
        default: AweYukiSU
      ksu_mode:
        required: false
        type: string
        default: "Off"

      # ==================== Optional Configuration ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
        default: "r1"
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Feature Toggles ====================
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_kpm:
        required: true
        type: string
        default: "disabled"
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: true
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload All"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      use_usb_arsenal:
        required: false
        type: boolean
        default: false
      use_ptrace:
        required: false
        type: boolean
        default: false
      use_perf:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Build configuration summary
        run: |
          echo "========================================"
          echo "     Kernel Build Configuration Summary"
          echo "========================================"
          echo "Android Version     : ${{ inputs.android_version }}"
          echo "Kernel Version      : ${{ inputs.kernel_version }}"
          echo "Sublevel            : ${{ inputs.sub_level }}"
          echo "OS Patch Level      : ${{ inputs.os_patch_level }}"
          echo "KSU Variant         : ${{ inputs.ksu_variant }}"
          echo "Build Time          : ${{ inputs.build_time }}"
          echo "SUSFS Enabled       : ${{ inputs.enable_susfs }}"
          echo "ZRAM Enhancement    : ${{ inputs.use_zram }}"
          echo "BBG Patch           : ${{ inputs.use_bbg }}"
          echo "KPM Feature         : ${{ inputs.use_kpm }}"
          echo "Re-Kernel           : ${{ inputs.use_rekernel }}"
          echo "NoMount             : ${{ inputs.use_nomount }}"
          echo "Networking          : ${{ inputs.use_networking }}"
          echo "USB Arsenal         : ${{ inputs.use_usb_arsenal }}"
          echo "Ptrace Patch        : ${{ inputs.use_ptrace }}"
          echo "Performance Patches : ${{ inputs.use_perf }}"
          echo "Module Bypass       : ${{ inputs.allow_version_mismatch }}"
          echo "CVE-2026-43499      : ${{ inputs.cve_2026_43499_patch }}"
          echo "Export SUSFS Patches: ${{ inputs.export_susfs_patches }}"
          echo "Droidspaces         : ${{ inputs.droidspaces }}"
          echo "NTSync              : ${{ inputs.droidspaces_ntsync }}"
          echo "Artifact Upload Mode: ${{ inputs.artifact_upload_mode }}"
          echo "Stock Config        : Auto-detect config/stock_defconfig"
          echo "========================================"

      - name: Free up disk space
        run: |
          # Move directories in parallel to a temp folder first (near-instant), then delete in the background at low priority without blocking subsequent steps.
          # The temp directory must be outside the workspace: checkout cleans the workspace as the runner user
          # and would fail with EACCES on root-owned files moved in via sudo mv.
          TRASH_DIR=/tmp/.background_trash
          sudo rm -rf "$TRASH_DIR"
          mkdir -p "$TRASH_DIR"/{1..17}

          safe_mv() {
            [ -e "$1" ] && sudo mv "$1" "$2" || true
          }
          export -f safe_mv

          safe_mv /usr/share/dotnet         "$TRASH_DIR"/1  &
          safe_mv /usr/local/lib/android    "$TRASH_DIR"/2  &
          safe_mv /opt/ghc                  "$TRASH_DIR"/3  &
          safe_mv /opt/hostedtoolcache/CodeQL "$TRASH_DIR"/4 &
          safe_mv /usr/local/aws-sam-cli    "$TRASH_DIR"/5  &
          safe_mv /usr/local/share/chromium "$TRASH_DIR"/6  &
          safe_mv /usr/local/share/powershell "$TRASH_DIR"/7 &
          safe_mv /usr/local/lib/heroku     "$TRASH_DIR"/8  &
          safe_mv /usr/local/lib/node_modules "$TRASH_DIR"/9 &
          safe_mv /opt/az                   "$TRASH_DIR"/10 &
          safe_mv /opt/microsoft/powershell "$TRASH_DIR"/11 &
          safe_mv /opt/hostedtoolcache/go   "$TRASH_DIR"/12 &
          safe_mv /opt/hostedtoolcache/PyPy "$TRASH_DIR"/13 &
          safe_mv /opt/hostedtoolcache/node "$TRASH_DIR"/14 &
          sudo bash -c "mv /usr/local/bin/aliyun /usr/local/bin/azcopy /usr/local/bin/bicep \
            /usr/local/bin/cmake-gui /usr/local/bin/cpack /usr/local/bin/helm \
            /usr/local/bin/hub /usr/local/bin/kubectl /usr/local/bin/minikube \
            /usr/local/bin/node /usr/local/bin/packer /usr/local/bin/sam \
            /usr/local/bin/stack /usr/local/bin/terraform /usr/local/bin/oc \
            $TRASH_DIR/15 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/julia* $TRASH_DIR/16 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/bin/pulumi* $TRASH_DIR/17 2>/dev/null || true" &
          wait

          # Delete at low priority in the background while also cleaning up browser packages and apt cache
          (
            sudo nice -n 19 ionice -c 3 rm -rf "$TRASH_DIR"
            sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable \
              >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            sudo apt-get clean >/dev/null 2>&1 || true
            command -v docker >/dev/null 2>&1 && \
              docker rmi $(docker images -q) 2>/dev/null || true
          ) >/dev/null 2>&1 &
          disown

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize build environment
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux_musl-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/boot_sign_key.pem
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          # storage.googleapis.com occasionally fails TLS handshakes (curl exit code 35); across 80+ matrix
          # jobs in a full build, hitting it is not uncommon. --retry-all-errors retries handshake errors,
          # and -f prevents HTTP error pages from being saved as the repo script.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: Display configuration
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Loading configuration file: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves lld llvm bc rsync cpio kmod lz4 zstd jq zip unzip

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=4G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # Only 6.1+ uses Bazel; persist --disk_cache to speed up subsequent builds
      - name: Restore Bazel disk cache
        if: inputs.android_version != 'android12' && inputs.android_version != 'android13'
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-main-kernel-2026-v2

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2026

          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::Toolchain fetch attempt $attempt/5 failed: $*"
              sleep $((5 * attempt))
            done
            return 1
          }

          rm -rf kernel-build-tools mkbootimg
          retry git clone --filter=blob:none --sparse --depth 1 -b "$BRANCH" \
            "$AOSP_MIRROR/kernel/prebuilts/build-tools" kernel-build-tools
          git -C kernel-build-tools sparse-checkout set linux_musl-x86/bin linux_musl-x86/lib64
          rm -rf kernel-build-tools/.git

          retry git clone --depth 1 -b "$BRANCH" \
            "$AOSP_MIRROR/platform/system/tools/mkbootimg" mkbootimg
          rm -rf mkbootimg/.git
          chmod +x kernel-build-tools/linux_musl-x86/bin/avbtool mkbootimg/mkbootimg.py mkbootimg/unpack_bootimg.py

      - name: Generate signing key
        run: |
          chmod +x "$AVBTOOL" "$MKBOOTIMG" "$UNPACK_BOOTIMG"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > "$BOOT_SIGN_KEY_PATH"

      - name: Configure Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      - name: Clone dependency repositories
        run: |
          # Dependency clones may hit transient network errors; use exponential backoff with random jitter so matrix jobs do not retry simultaneously.
          # Clean the destination directory before each attempt so partial leftovers do not break retries.
          clone_with_retry() {
            local repository="$1" destination="$2"
            shift 2
            local attempt delay rc=1
            for attempt in 1 2 3 4 5; do
              echo "Cloning $repository (attempt $attempt/5)..."
              rm -rf -- "$destination" || return 1
              if git clone "$repository" "$destination" "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((15 * (1 << (attempt - 1)) + RANDOM % 10))
                echo "::warning::Failed to clone $repository (exit code $rc), retrying in ${delay}s"
                sleep "$delay" || return 1
              fi
            done
            rm -rf -- "$destination" || return 1
            echo "Failed to clone $repository after 5 attempts (exit code $rc)" >&2
            return "$rc"
          }

          ANYKERNEL_BRANCH="gki-2.0"

          echo "Cloning AnyKernel3..."
          clone_with_retry https://github.com/WildKernels/AnyKernel3.git AnyKernel3 -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "Preparing patch repositories..."
          clone_with_retry https://github.com/WildKernels/kernel_patches.git kernel_patches
          clone_with_retry https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch
          echo "Using current repository patch directory: $ZZH_PATCHES"
          clone_with_retry https://github.com/Numbersf/Action-Build.git Action-Build --depth=1

      - name: Initialize and sync kernel source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          MAX_ATTEMPTS=5
          RETRY_DELAYS=(15 30 60 120 240)
          SYNC_TIMEOUT=20m

          # Abort zero-progress stalls (<1 KB/s for 60s) via git env-config inherited by repo's child git processes
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.lowSpeedLimit
          export GIT_CONFIG_VALUE_0=1024
          export GIT_CONFIG_KEY_1=http.lowSpeedTime
          export GIT_CONFIG_VALUE_1=60

          # android.googlesource.com occasionally rate-limits, resets connections, or stalls on a single project;
          # a single failure does not mean the branch is broken, and retrying the round usually succeeds.
          init_repo() {
            $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} --repo-rev=v2.74 || return 1

            # ls-remote can also fail transiently; an empty output on failure would misclassify deprecated/deleted branches,
            # so retry on non-zero exit codes and restart the round if all attempts fail rather than wasting a sync.
            local ok=false
            for _ in 1 2 3; do
              if REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH}); then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "git ls-remote failed for ${FORMATTED_BRANCH}"
              return 1
            fi

            DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
            TAG_FALLBACK=""
            if grep -q deprecated <<< "$REMOTE_BRANCH"; then
              echo "Detected deprecated branch: $FORMATTED_BRANCH"
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
            elif [ -z "$REMOTE_BRANCH" ]; then
              # Google eventually deletes expired monthly branches altogether (neither active nor under deprecated/),
              # while the manifest still references the branch. Release tags are preserved, so fall back to the highest _rN tag.
              # Must use the full refs/tags/ path; a bare tag name would be looked up under refs/heads/ by repo.
              local latest_tag
              latest_tag=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null \
                | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' \
                | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
              if [ -z "$latest_tag" ]; then
                echo "::error::Branch ${FORMATTED_BRANCH} has neither an upstream branch nor a release tag"
                return 1
              fi
              echo "Branch ${FORMATTED_BRANCH} was deleted upstream; falling back to release tag: $latest_tag"
              sed -i "/path=\"common\"/ s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${latest_tag}\"|" $DEFAULT_MANIFEST_PATH
              TAG_FALLBACK="$latest_tag"
            fi
          }

          attempt=1
          while :; do
            echo "Attempt $attempt/$MAX_ATTEMPTS to init and sync branch: common-${FORMATTED_BRANCH} (timeout $SYNC_TIMEOUT)"
            df -h "$PWD" | tail -n +2 || true

            rc=0
            if init_repo; then
              # Omit --no-tags when falling back to a release tag so repo fetches tag refs properly.
              SYNC_TAG_FLAGS="--no-tags"
              [ -n "$TAG_FALLBACK" ] && SYNC_TAG_FLAGS=""
              SYNC_FLAGS="-c --current-branch -j16 --jobs-checkout=$(nproc) $SYNC_TAG_FLAGS --no-clone-bundle --retry-fetches=3"
              [ "$attempt" -gt 1 ] && SYNC_FLAGS="$SYNC_FLAGS --force-sync"
              timeout -k 60 "$SYNC_TIMEOUT" $REPO sync $SYNC_FLAGS || rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "Kernel source synced successfully (attempt $attempt)"
                break
              fi
              if [ "$rc" -eq 124 ]; then
                echo "repo sync timed out ($SYNC_TIMEOUT)"
              else
                echo "repo sync failed with exit code $rc"
              fi
            else
              rc=1
              echo "repo init or branch precheck failed"
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Kernel source sync failed $MAX_ATTEMPTS times consecutively"
              exit "$rc"
            fi

            # Wipe everything on failed rounds where partial checkouts could poison subsequent syncs
            if [ "$attempt" -ge 2 ]; then
              echo "Cleaning working directory before retry"
              find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi

            RETRY_DELAY="${RETRY_DELAYS[$((attempt - 1))]}"
            echo "Retrying in ${RETRY_DELAY}s..."
            sleep "$RETRY_DELAY"
            attempt=$((attempt + 1))
          done

          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV
          echo "TAG_FALLBACK=$TAG_FALLBACK" >> $GITHUB_ENV

      - name: Apply Stock Config spoofing
        run: |
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

          if [ ! -f "$STOCK_SRC" ]; then
            echo "$STOCK_SRC not found, skipping Stock Config spoofing."
            exit 0
          fi

          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::Failed to copy stock_defconfig: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "Copied stock_defconfig -> $STOCK_DST"

          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::$TARGET_MAKEFILE not found"
            exit 1
          fi

          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data rule already points to stock_defconfig, skipping."
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "Updated config_data rule in $TARGET_MAKEFILE"
          else
            echo "::error::Rule not found in $TARGET_MAKEFILE: $OLD_RULE"
            exit 1
          fi

      - name: Extract actual sublevel
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "Actual sublevel: $ACTUAL_SUBLEVEL"

      # Check against the synced actual SUBLEVEL to avoid re-applying patches on LTS branches that already include upstream fixes
      - name: Apply CVE-2026-43499 rtmutex fix chain
        if: inputs.cve_2026_43499_patch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
            "${{ inputs.kernel_version }}" \
            "$ACTUAL_SUBLEVEL" \
            "$GITHUB_WORKSPACE/security_patch"

      - name: Fix glibc 2.38 compatibility
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          RAW_SUB="$ACTUAL_SUBLEVEL"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            if [ -f tools/bpf/resolve_btfids/Makefile ] \
              && grep -q '\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)' tools/bpf/resolve_btfids/Makefile; then
              echo "Applying glibc >= 2.38 resolve_btfids Makefile EXTRA_CFLAGS fix..."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile
            fi

            if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $CURRENT_SUB -le 186 ]] ||
               [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $CURRENT_SUB -le 119 ]] ||
               [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $CURRENT_SUB -le 43 ]]; then
              if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi

      - name: Add OnePlus 8E processor support
        if: inputs.supp_op
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "Adding OnePlus 8E support patch..."
          if [ -f "$GITHUB_WORKSPACE/hmbird_patch.c" ]; then
            cp "$GITHUB_WORKSPACE/hmbird_patch.c" hmbird_patch.c
          else
            curl -LSs "https://github.com/AweYuki/GKI_KernelSU_SUSFS/raw/refs/heads/dev/hmbird_patch.c" -o hmbird_patch.c
          fi
          echo "obj-y += hmbird_patch.o" >> Makefile

      - name: Determine KernelSU branch
        id: ksu-branch
        if: inputs.ksu_mode != 'Disable KSU'
        run: |
          variant_input="${{ inputs.ksu_variant }}"
          if [ "$variant_input" != "AweYukiSU" ]; then
            echo "Unsupported KernelSU variant: $variant_input (only AweYukiSU is supported)" >&2
            exit 1
          fi

          BRANCH="-s main"

          # Check custom commit configuration
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              AWEYUKISU_COMMIT=$(grep "^aweyukisu=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
              if [ -n "$AWEYUKISU_COMMIT" ]; then
                BRANCH="-s $AWEYUKISU_COMMIT"
                echo "AweYukiSU using custom commit: $AWEYUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU branch: $BRANCH"

      - name: Integrate KernelSU
        if: inputs.ksu_mode != 'Disable KSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "Adding AweYukiSU..."
          curl -LSs "https://raw.githubusercontent.com/AweYuki/AweYukiSU/main/kernel/setup.sh" |
            sed 's|Baka-SU/BakaSU|AweYuki/AweYukiSU|g' |
            bash $BRANCH

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          else
            echo "KSU_LATEST_COMMIT_DATE=unknown" >> $GITHUB_ENV
          fi

      # Fetch SUSFS after kernel source and KSU setup are complete to avoid front-loading network fetches.
      - name: Clone SUSFS source
        if: inputs.enable_susfs
        run: |
          set -euo pipefail

          # Retry up to 5 times with a fixed 5-second delay between attempts.
          retry() {
            local attempt rc=1
            for attempt in 1 2 3 4 5; do
              echo "Attempt $attempt/5: $*"
              if "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "::warning::Command failed (exit code $rc), retrying in 5s: $*"
                sleep 5 || return 1
              fi
            done
            echo "Command failed after 5 attempts (exit code $rc): $*" >&2
            return "$rc"
          }

          # Clean up partial leftovers so retries are not blocked by an existing directory.
          clone_susfs() {
            local rc
            rm -rf -- susfs4ksu || return 1
            if git clone "$1" -b "$SUSFS_BRANCH" susfs4ksu; then
              return 0
            else
              rc=$?
            fi
            rm -rf -- susfs4ksu || return 1
            return "$rc"
          }

          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

          echo "Cloning SUSFS (branch: $SUSFS_BRANCH)..."
          retry clone_susfs https://gitlab.com/simonpunk/susfs4ksu.git

          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
              if [ -n "$CUSTOM_COMMIT" ]; then
                echo "Checking out custom SUSFS commit: $CUSTOM_COMMIT"
                cd susfs4ksu
                retry git checkout "$CUSTOM_COMMIT"
                cd ..
              fi
            fi
          fi

          echo "Actual SUSFS commit: $(git -C susfs4ksu rev-parse HEAD)"
          SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> "$GITHUB_ENV"
          echo "Latest SUSFS commit date: $SUSFS_LATEST_COMMIT_DATE"

      # ==================== Export Integrated SUSFS Patch ====================
      # Exported for AweYukiSU when SUSFS is enabled; uses a temporary git index to snapshot tree objects
      # without creating a commit, preserving the HEAD hash read by "Configure kernel localversion".
      - name: Record SUSFS baseline snapshot
        if: inputs.export_susfs_patches && inputs.enable_susfs && inputs.ksu_mode != 'Disable KSU' && inputs.ksu_variant == 'AweYukiSU'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # Exclude .rej/.orig and patch files themselves: apply.sh copies SUSFS patches into common/ and may leave .rej files.
          # Copy the real index first so git add only hashes modified files instead of re-hashing the entire kernel tree.
          cp "$(git rev-parse --git-path index)" /tmp/susfs-base.idx
          export GIT_INDEX_FILE=/tmp/susfs-base.idx
          git add -A -- . ':!*.rej' ':!*.orig' ':!*.patch'
          SUSFS_BASE_TREE=$(git write-tree)
          echo "SUSFS_BASE_TREE=$SUSFS_BASE_TREE" >> $GITHUB_ENV
          echo "SUSFS_PATCH_EXPORT=true" >> $GITHUB_ENV
          echo "Baseline tree object: $SUSFS_BASE_TREE"

      - name: Apply SUSFS patches
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          SUB_LEVEL: ${{ inputs.sub_level }}
        run: bash "$GITHUB_WORKSPACE/scripts/susfs_fixes/apply.sh"

      - name: Generate integrated SUSFS patch
        if: env.SUSFS_PATCH_EXPORT == 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        env:
          OUT_DIR: ${{ github.workspace }}/susfs-patch
        run: |
          export_susfs_patch() {
            cp /tmp/susfs-base.idx /tmp/susfs-after.idx || return 1
            export GIT_INDEX_FILE=/tmp/susfs-after.idx
            git add -A -- . ':!*.rej' ':!*.orig' ':!*.patch' || return 1
            local after_tree
            after_tree=$(git write-tree) || return 1
            unset GIT_INDEX_FILE

            mkdir -p "$OUT_DIR"
            git diff --binary "$SUSFS_BASE_TREE" "$after_tree" > "$OUT_DIR/susfs.patch" || return 1
            if [ ! -s "$OUT_DIR/susfs.patch" ]; then
              echo "Patch content is empty"
              return 1
            fi
            # Dry-run reverse apply to verify the patch matches the current working tree exactly
            git apply --check -R "$OUT_DIR/susfs.patch" || return 1

            local formatted_branch gki_branch gki_commit
            formatted_branch="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
            gki_branch="$formatted_branch"
            grep -q deprecated <<< "$REMOTE_BRANCH" && gki_branch="deprecated/$formatted_branch"
            # When the branch has been deleted upstream, a release tag is checked out instead
            [ -n "$TAG_FALLBACK" ] && gki_branch="refs/tags/$TAG_FALLBACK"
            gki_commit=$(git rev-parse HEAD)

            # Read KSU and SUSFS commits directly from the repositories cloned in this build rather than querying ls-remote
            local ksu_repo ksu_commit ksu_slug ksu_setup_cmd
            ksu_repo=$(git -C "$KERNEL_ROOT/KernelSU" remote get-url origin | sed 's/\.git$//')
            ksu_commit=$(git -C "$KERNEL_ROOT/KernelSU" rev-parse HEAD)
            ksu_slug=${ksu_repo#https://github.com/}
            ksu_setup_cmd="curl -LSs https://raw.githubusercontent.com/$ksu_slug/main/kernel/setup.sh | sed 's|Baka-SU/BakaSU|$ksu_slug|g' | bash -s $ksu_commit"

            local susfs_repo susfs_branch susfs_commit
            susfs_repo=$(git -C "$SUSFS4KSU" remote get-url origin | sed 's/\.git$//')
            susfs_branch="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
            susfs_commit=$(git -C "$SUSFS4KSU" rev-parse HEAD)

            local rej_count patch_sha256
            # Unmodified upstream .rej files (e.g., mm/rmap.c.rej in android15-6.6-2026-04) do not count as conflicts;
            # failed patches overwrite same-named files, so modified ones are still counted.
            rej_count=$(comm -23 \
              <(find . -type f -name '*.rej' | sed 's|^\./||' | sort) \
              <(git ls-files -- '*.rej' | while IFS= read -r f; do git diff --quiet -- "$f" && echo "$f"; done | sort) | wc -l)
            patch_sha256=$(sha256sum "$OUT_DIR/susfs.patch" | awk '{print $1}')

            jq -n \
              --arg android_version "${{ inputs.android_version }}" \
              --arg kernel_version "${{ inputs.kernel_version }}" \
              --arg sub_level "${{ inputs.sub_level }}" \
              --arg actual_sublevel "$ACTUAL_SUBLEVEL" \
              --arg os_patch_level "${{ inputs.os_patch_level }}" \
              --arg gki_branch "$gki_branch" \
              --arg gki_commit "$gki_commit" \
              --arg ksu_variant "${{ inputs.ksu_variant }}" \
              --arg ksu_repo "$ksu_repo" \
              --arg ksu_commit "$ksu_commit" \
              --arg ksu_setup_cmd "$ksu_setup_cmd" \
              --arg susfs_repo "$susfs_repo" \
              --arg susfs_branch "$susfs_branch" \
              --arg susfs_commit "$susfs_commit" \
              --argjson rej_count "$rej_count" \
              --arg patch_sha256 "$patch_sha256" \
              --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              --arg run_id "$GITHUB_RUN_ID" \
              '$ARGS.named' > "$OUT_DIR/manifest.json" || return 1

            echo "Patch size: $(du -h "$OUT_DIR/susfs.patch" | cut -f1), .rej count: $rej_count"
            cat "$OUT_DIR/manifest.json"
          }

          if ! export_susfs_patch; then
            echo "::warning::Failed to export integrated SUSFS patch; skipping patch upload for this build"
            rm -rf "$OUT_DIR"
            echo "SUSFS_PATCH_EXPORT=false" >> $GITHUB_ENV
          fi

      - name: Clone Droidspaces patches repository
        if: inputs.droidspaces != 'off'
        run: |
          git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          echo "DROIDSPACES_PATCHES=/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV

      - name: Backup baseline defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: Integrate NoMount metamodule
        if: inputs.use_nomount
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # NoMount is a mount metamodule registered under fs/; it does not conflict with SUSFS sus_mount and coexists with any KSU variant.
          # Must run after "Generate integrated SUSFS patch" so NoMount changes are excluded from susfs.patch,
          # and append CONFIG after "Backup baseline defconfig" so the 6.1+ Bazel fragment diff captures CONFIG_NOMOUNT.
          set -euo pipefail
          # Fetch the NoMount kernel integration script (latest dev branch commit), which clones the repo, creates the fs/nomount symlink, and registers Kconfig/Makefile (with idempotency guards)
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

          if [ ! -L "fs/nomount" ]; then
            echo "::error::NoMount integration failed: fs/nomount symlink missing"
            exit 1
          fi
          echo "NoMount integration complete, commit: $(git -C NoMount rev-parse HEAD)"

          # Enable NoMount in defconfig (idempotent)
          if ! grep -q '^CONFIG_NOMOUNT=y' "$DEFCONFIG"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG"
            echo "Enabled CONFIG_NOMOUNT=y"
          else
            echo "CONFIG_NOMOUNT=y already present, skipping"
          fi

      - name: Integrate Droidspaces support
        if: inputs.droidspaces != 'off'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          KERNEL_VER="${{ inputs.kernel_version }}"
          SLOT="${{ inputs.droidspaces }}"

          # 678 -> 6_7_8, 123 -> 1_2_3, 345 -> 3_4_5
          SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
          echo "Applying Droidspaces SYSVIPC kABI fix patch (slot: $SLOT / $SLOT_NAME)..."
          case "$KERNEL_VER" in
            6.12)
              PATCH_FILE="$DROIDSPACES_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
              ;;
            5.10|5.15|6.1|6.6)
              PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
              ;;
            *)
              echo "::warning::Droidspaces: unsupported kernel version $KERNEL_VER, skipping patch"
              exit 0
              ;;
          esac
          if ! patch -p1 --forward < "$PATCH_FILE"; then
            echo "::warning::Failed to apply SYSVIPC kABI patch; may already be applied or context mismatched"
          fi

          # 5.10 and below also require the POSIX_MQUEUE kABI fix
          if [ "$KERNEL_VER" = "5.10" ]; then
            echo "Applying Droidspaces POSIX_MQUEUE kABI fix patch (5.10)..."
            POSIX_PATCH="$DROIDSPACES_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
            if ! patch -p1 --forward < "$POSIX_PATCH"; then
              echo "::warning::Failed to apply POSIX_MQUEUE kABI patch; may already be applied or context mismatched"
            fi
          fi

          # On Android 16 / 6.12, rust_binder.ko references init_ipc_ns and put_ipc_ns when IPC_NS is enabled,
          # but current AOSP common branches do not export those symbols yet.
          if [ "$KERNEL_VER" = "6.12" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/build_helpers/binder_ipc_ns_exports.py" "$PWD"
          fi

          echo "Adding Droidspaces kernel config options..."
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  Already enabled: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  Switched on: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  Added: $cfg"
            fi
          }

          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  Not defined in current kernel: $cfg, skipping"
            fi
          }

          # Required options + WildKernels container baseline (binfmt, overlayfs, macvlan, IPv6 NAT)
          enable_config CONFIG_SYSVIPC
          enable_config CONFIG_POSIX_MQUEUE
          enable_config CONFIG_IPC_NS
          enable_config CONFIG_PID_NS
          enable_config CONFIG_DEVTMPFS
          enable_config CONFIG_USER_NS
          enable_config CONFIG_OVERLAY_FS
          enable_config_if_defined CONFIG_BINFMT_MISC
          enable_config_if_defined CONFIG_BINFMT_SCRIPT
          enable_config_if_defined CONFIG_BINFMT_ELF
          enable_config_if_defined CONFIG_MACVLAN

          # Optional: networking options (Docker/NAT mode)
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT
          enable_config_if_defined CONFIG_IP6_NF_NAT
          enable_config_if_defined CONFIG_IP6_NF_TARGET_MASQUERADE
          enable_config_if_defined CONFIG_IP_SET
          enable_config_if_defined CONFIG_IP_SET_HASH_IP
          enable_config_if_defined CONFIG_IP_SET_HASH_NET
          enable_config_if_defined CONFIG_NETFILTER_XT_SET

          # REJECT target symbol names vary across kernel versions; enable whichever are defined
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
          enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT
          enable_config_if_defined CONFIG_IP6_NF_TARGET_REJECT

          echo "Droidspaces integration complete"

          echo "Configuring GKI 6.6 unprivileged user networking (Droidspaces)"
          # Explicitly disable options (Android paranoid network restriction must be disabled)
          disable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=n" "$DEFCONFIG"; then
              echo "  Already disabled: $cfg"
            elif grep -q "^${cfg}=y" "$DEFCONFIG"; then
              sed -i "s/^${cfg}=y$/${cfg}=n/" "$DEFCONFIG"
              echo "  Disabled: $cfg"
            else
              echo "# ${cfg} is not set" >> "$DEFCONFIG"
              echo "  Added as disabled: $cfg"
            fi
          }

          if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
            # Disable Android paranoid network control so unprivileged users inside containers can access the network
            disable_config CONFIG_ANDROID_PARANOID_NETWORK
          fi

      - name: Inject NTSync kernel patch and config
        if: inputs.droidspaces_ntsync
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          echo "=== Injecting NTSync kernel patch ==="
          echo "Android Version: ${{ inputs.android_version }}"
          echo "Kernel Version: ${{ inputs.kernel_version }}"

          RAW_SUB="$ACTUAL_SUBLEVEL"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          # Apply WildKernels lockdep prerequisite patches for older android12-5.10 sublevels
          if [[ "${{ inputs.android_version }}-${{ inputs.kernel_version }}" == "android12-5.10" ]]; then
            if [[ "$CURRENT_SUB" -le 66 ]]; then
              patch -p1 -N < "$GITHUB_WORKSPACE/patches/ntsync/0001-lockdep-detect-recursive-read.patch" || true
            fi
            if [[ "$CURRENT_SUB" -le 209 ]] && ! grep -q 'lockdep_assert_none_held_once' include/linux/lockdep.h 2>/dev/null; then
              patch -p1 -N < "$GITHUB_WORKSPACE/patches/ntsync/0002-lockdep-assert-none-held.patch"
            fi
          fi

          case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
            android12-5.10)
              NTSYNC_PATCH="ntsync_compat_android12-5.10"
              ;;
            android13-5.15)
              NTSYNC_PATCH="ntsync_compat_android13-5.15"
              ;;
            android14-6.1)
              NTSYNC_PATCH="ntsync_compat_android14-6.1"
              ;;
            android15-6.6)
              NTSYNC_PATCH="ntsync_compat_android15-6.6"
              ;;
            android16-6.12)
              NTSYNC_PATCH="ntsync_compat_android16-6.12"
              ;;
            *)
              echo "::warning::NTSync: unsupported ${{ inputs.android_version }} / ${{ inputs.kernel_version }}, skipping patch"
              exit 0
              ;;
          esac

          echo "Selected NTSync patch: ${NTSYNC_PATCH}.patch"
          PATCH_DIR=$(mktemp -d)
          trap 'rm -rf "$PATCH_DIR"' EXIT
          PATCH_URL="https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync"
          LOCAL_NTSYNC_DIR="$KERNEL_PATCHES/common/ntsync"

          ntsync_complete() {
            local root="$1" symbol
            [ -f "$root/drivers/misc/ntsync.c" ] && [ -f "$root/include/uapi/linux/ntsync.h" ] || return 1
            for symbol in CREATE_MUTEX CREATE_EVENT WAIT_ANY WAIT_ALL; do
              grep -qF "case NTSYNC_IOC_${symbol}:" "$root/drivers/misc/ntsync.c" || return 1
              grep -qE "^#define[[:space:]]+NTSYNC_IOC_${symbol}[[:space:]]" "$root/include/uapi/linux/ntsync.h" || return 1
            done
          }

          # 6.12 ships an early semaphore-only implementation; do not skip the full backport merely because the files exist.
          if ntsync_complete .; then
            echo "Complete NTSync implementation already present; keeping source and skipping base patch"
          else
            if [ -e drivers/misc/ntsync.c ] || [ -e include/uapi/linux/ntsync.h ]; then
              if [ "${{ inputs.android_version }}-${{ inputs.kernel_version }}" = "android16-6.12" ] \
                && [ -f drivers/misc/ntsync.c ] && [ -f include/uapi/linux/ntsync.h ] \
                && grep -qF 'NTSYNC_IOC_SEM_POST' drivers/misc/ntsync.c \
                && grep -qF 'NTSYNC_IOC_SEM_POST' include/uapi/linux/ntsync.h \
                && ! grep -qE 'NTSYNC_IOC_(WAIT_ANY|WAIT_ALL)' drivers/misc/ntsync.c include/uapi/linux/ntsync.h; then
                echo "Upgrading incomplete built-in NTSync implementation on Android 16 / 6.12"
              else
                echo "::error::Existing NTSync files are incomplete or unrecognized; refusing to overwrite — check source and headers"
                exit 1
              fi
            fi

            # Prefer WildKernels/kernel_patches local copy with remote fallback
            if [ -f "$LOCAL_NTSYNC_DIR/ntsync_base.patch" ]; then
              cp "$LOCAL_NTSYNC_DIR/ntsync_base.patch" "$PATCH_DIR/ntsync_base.patch"
            else
              wget -q -O "$PATCH_DIR/ntsync_base.patch" "$PATCH_URL/ntsync_base.patch"
            fi
            mkdir -p "$PATCH_DIR/base/drivers/misc" "$PATCH_DIR/base/include/uapi/linux"
            patch --batch --forward -p1 -d "$PATCH_DIR/base" < "$PATCH_DIR/ntsync_base.patch"
            if ! ntsync_complete "$PATCH_DIR/base"; then
              echo "::error::NTSync base patch is missing complete ioctl interfaces; aborting installation"
              exit 1
            fi
            mkdir -p drivers/misc include/uapi/linux
            cp "$PATCH_DIR/base/drivers/misc/ntsync.c" drivers/misc/ntsync.c
            cp "$PATCH_DIR/base/include/uapi/linux/ntsync.h" include/uapi/linux/ntsync.h
          fi

          # The 6.12 compat patch only drops BROKEN; skip if the native driver is already wired into Kconfig / Makefile.
          if [ "${{ inputs.android_version }}-${{ inputs.kernel_version }}" = "android16-6.12" ] \
            && grep -qE '^config NTSYNC$' drivers/misc/Kconfig \
            && ! awk '/^config NTSYNC$/ {f=1; next} f && /^(menuconfig|config) / {exit} f {print}' drivers/misc/Kconfig | grep -qw BROKEN \
            && grep -qE '^[[:space:]]*obj-\$\(CONFIG_NTSYNC\)[[:space:]]*\+=[[:space:]]*ntsync\.o([[:space:]]|$)' drivers/misc/Makefile; then
            echo "NTSync already wired into Kconfig / Makefile, skipping compat patch"
          else
            if [ -f "$LOCAL_NTSYNC_DIR/${NTSYNC_PATCH}.patch" ]; then
              cp "$LOCAL_NTSYNC_DIR/${NTSYNC_PATCH}.patch" "$PATCH_DIR/compat.patch"
            else
              wget -q -O "$PATCH_DIR/compat.patch" "$PATCH_URL/${NTSYNC_PATCH}.patch"
            fi
            if patch --dry-run --batch --forward -p1 < "$PATCH_DIR/compat.patch" > "$PATCH_DIR/compat-check.log" 2>&1; then
              patch --batch --forward -p1 < "$PATCH_DIR/compat.patch"
            elif patch --dry-run --batch --reverse -p1 < "$PATCH_DIR/compat.patch" > /dev/null 2>&1; then
              echo "NTSync compat patch already applied, skipping"
            else
              cat "$PATCH_DIR/compat-check.log"
              echo "::error::NTSync compat patch failed to apply cleanly; aborting configuration"
              exit 1
            fi
          fi

          cd ..

          CONFIG_PATH="./common/arch/arm64/configs/gki_defconfig"
          echo "Checking and enabling CONFIG_NTSYNC..."

          # Normalize to a single built-in entry so existing =m / =n lines do not conflict.
          sed -i '/^# CONFIG_NTSYNC is not set$/d; /^CONFIG_NTSYNC=/d' "$CONFIG_PATH"
          echo "CONFIG_NTSYNC=y" >> "$CONFIG_PATH"
          echo "Enabled CONFIG_NTSYNC=y"

          echo "=== NTSync patch and config injection complete ==="

      - name: Apply Unicode bypass fix
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # Upstream 2023-11, 2024-01, and 2024-03 monthly branches already include "unicode: Don't special case ignorable code points";
          # patch --forward detects it as applied and skips, but still writes ignored hunks to .rej, so check idempotently first.
          if [ -f fs/unicode/mkutf8data.c ] && ! grep -q 'ignore_init' fs/unicode/mkutf8data.c; then
            echo "Unicode bypass fix already present in source, skipping patch"
            exit 0
          fi
          if [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

      - name: Configure ZRAM LZ4 patch stack
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          echo "Upgrading LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          bash $ZZH_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4kd.patch ./
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::Failed to apply lz4kd.patch; may already be applied or context mismatched"
          fi

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch ./
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::Failed to apply lz4k_oplus.patch; may already be applied or context mismatched"
          fi

      - name: Fix 6.6 Wi-Fi/Bluetooth compatibility (Samsung + Xiaomi)
        if: inputs.kernel_version == '6.6'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          ensure_line_once() {
            local file="$1"
            local line="$2"
            if [ ! -f "$file" ]; then
              echo "::error::File not found: $file"
              exit 1
            fi
            if ! grep -qF "$line" "$file"; then
              echo "$line" >> "$file"
            fi
          }

          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          DRIVERS_MAKEFILE="drivers/Makefile"
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          MIN_KDP_DST="drivers/min_kdp.c"

          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

          if [ ! -f "$MIN_KDP_PATCH" ]; then
            echo "::error::Patch not found: $MIN_KDP_PATCH"
            exit 1
          fi
          if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
          elif [ -f android/abi_gki_aarch64.stg ]; then
            echo "Rigid min_kdp .stg patch drifted upstream; falling back to idempotent STG symbol insert"
            python3 - android/abi_gki_aarch64.stg <<'PYEOF'
          import sys
          stg_path = sys.argv[1]
          with open(stg_path) as f:
              src = f.read()
          def ensure_before(anchor, block, label):
              global src
              if label in src:
                  return
              if anchor in src:
                  src = src.replace(anchor, block + anchor, 1)
              else:
                  if not src.endswith('\n'):
                      src += '\n'
                  src += block
          func1 = ('function {\n  id: 0x1e5195df\n  return_type_id: 0x48b5725f\n'
                   '  parameter_id: 0x3d551c03\n  parameter_id: 0x6720d32f\n}\n')
          func2 = ('function {\n  id: 0xc18e39fb\n  return_type_id: 0x4585663f\n'
                   '  parameter_id: 0x3d551c03\n}\n')
          elf1 = ('elf_symbol {\n  id: 0xb0801f6e\n  name: "kdp_set_cred_non_rcu"\n  is_defined: true\n'
                  '  symbol_type: FUNCTION\n  crc: 0x738bae5e\n  type_id: 0x1e5195df\n'
                  '  full_name: "kdp_set_cred_non_rcu"\n}\n')
          elf2 = ('elf_symbol {\n  id: 0x3037c5bc\n  name: "kdp_usecount_dec_and_test"\n  is_defined: true\n'
                  '  symbol_type: FUNCTION\n  crc: 0xda582aa5\n  type_id: 0xc18e39fb\n'
                  '  full_name: "kdp_usecount_dec_and_test"\n}\n')
          elf3 = ('elf_symbol {\n  id: 0x8334a496\n  name: "kdp_usecount_inc"\n  is_defined: true\n'
                  '  symbol_type: FUNCTION\n  crc: 0xfb342499\n  type_id: 0x1fcd1693\n'
                  '  full_name: "kdp_usecount_inc"\n}\n')
          ensure_before('function {\n  id: 0x1e571002', func1, 'id: 0x1e5195df')
          ensure_before('function {\n  id: 0xc18f1240', func2, 'id: 0xc18e39fb')
          elf_anchor = 'elf_symbol {\n  id: 0x493ce9fc\n  name: "loops_per_jiffy"'
          for block, label in [(elf1, '"kdp_set_cred_non_rcu"'), (elf2, '"kdp_usecount_dec_and_test"'), (elf3, '"kdp_usecount_inc"')]:
              ensure_before(elf_anchor, block, label)
          iface_ids = ['0xb0801f6e', '0x3037c5bc', '0x8334a496']
          missing = [i for i in iface_ids if f'symbol_id: {i}' not in src]
          if missing:
              lines = [f'  symbol_id: {i}\n' for i in missing]
              anchor = '  symbol_id: 0xc750a072\n'
              if anchor in src:
                  src = src.replace(anchor, anchor + ''.join(lines), 1)
              else:
                  idx = src.find('interface {')
                  end = src.find('\n}', idx) if idx != -1 else -1
                  if end != -1:
                      src = src[:end + 1] + ''.join(lines) + src[end + 1:]
          with open(stg_path, 'w') as f:
              f.write(src)
          PYEOF
          else
            echo "min_kdp symbols patch already applied or STG absent, skipping."
          fi

          if [ ! -f "$MIN_KDP_SRC" ]; then
            echo "::error::File not found: $MIN_KDP_SRC"
            exit 1
          fi
          cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
          ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

          ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"

      - name: Configure ZRAM options
        if: inputs.use_zram
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          EOF
          fi

          if [ "${{ inputs.kernel_version }}" != "6.6" ] && [ "${{ inputs.kernel_version }}" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.kernel_version }}" = "6.6" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
          fi

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            cat "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
          fi

      - name: Add Baseband-guard (BBG) patch
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      - name: Apply networking enhancements (BBRv3 / IPSet / Qdisc / CIFS)
        if: inputs.use_networking
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail

          BBR3_DIR="$KERNEL_PATCHES/common/bbrv3"
          KVER="${{ inputs.kernel_version }}"
          AVER="${{ inputs.android_version }}"

          # ---------- BBRv3 patch: dispatch by version (from WildKernels/kernel_patches) ----------
          case "$AVER-$KVER" in
            android12-5.10) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch" ;;
            android13-5.15) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android13-5.15.patch" ;;
            android14-6.1)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" ;;
            android15-6.6)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch" ;;
            *) BBR3_PATCH="" ;;
          esac

          # LTS branches continuously merge stable fixes, so context diverges from monthly branches (e.g., sysctl_net_ipv4.c
          # adding tcp_min_rcvbuf before /* obsolete */); use the matching -lts patch on LTS builds when available.
          if [ -n "$BBR3_PATCH" ] && [ "${{ inputs.os_patch_level }}" = "lts" ] && [ -f "${BBR3_PATCH%.patch}-lts.patch" ]; then
            BBR3_PATCH="${BBR3_PATCH%.patch}-lts.patch"
          fi

          # No upstream backport patch exists for android16-6.12 (disabled in wild_kernel); keep baseline BBR v1 only
          if [ -n "$BBR3_PATCH" ]; then
            if [ ! -f "$BBR3_PATCH" ]; then
              echo "::error::BBRv3 patch not found: $BBR3_PATCH" >&2
              exit 1
            fi
            echo "[*] Using BBRv3 patch: $(basename "$BBR3_PATCH")"
            if patch -p1 --dry-run < "$BBR3_PATCH" >/dev/null 2>&1; then
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH"
              echo "[+] Applied BBRv3 patch"
            else
              echo "::error::Failed to apply BBRv3 patch; keeping .rej files for Rejects artifact analysis" >&2
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH" || true
              exit 1
            fi

            RAW_SUB="$ACTUAL_SUBLEVEL"
            [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB
            if [ "$AVER-$KVER" = "android13-5.15" ] && [ "$CURRENT_SUB" -le 43 ]; then
              patch -p1 --forward < "$GITHUB_WORKSPACE/patches/bbrv3/0002-net-tcp-add-tcp_snd_cwnd-and-tcp_snd_cwnd_set-helper-functions.patch"
              echo "[+] Applied 5.15 <= 43 tcp_snd_cwnd helper prerequisite patch"
            fi
          else
            echo "[*] No BBRv3 backport for $AVER-$KVER, skipping patch"
          fi

          # 5.10 lacks proc_dou8vec_minmax (a 5.15+ sysctl API required by BBRv3); apply the two prerequisite patches
          if [ "$KVER" = "5.10" ] && ! grep -qF 'int proc_dou8vec_minmax(' include/linux/sysctl.h 2>/dev/null; then
            for prepatch in sysctl_add_proc_dou8vec_minmax sysctl_fix_data-races_in_proc_dou8vec_minmax; do
              if patch -p1 --dry-run < "$BBR3_DIR/$prepatch.patch" >/dev/null 2>&1; then
                patch -p1 --no-backup-if-mismatch < "$BBR3_DIR/$prepatch.patch"
              else
                echo "::error::Failed to apply 5.10 sysctl prerequisite patch: $prepatch" >&2
                exit 1
              fi
            done
            echo "[+] Applied 5.10 sysctl prerequisite patches"
          fi

          set_config() {
            local key="$1" value="$2"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
          }

          # Full IPSet suite + netfilter integration (verified present in Kconfig across all versions)
          for cfg in IP_SET IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC IP_SET_BITMAP_PORT \
            IP_SET_HASH_IP IP_SET_HASH_IPMARK IP_SET_HASH_IPPORT IP_SET_HASH_IPPORTIP \
            IP_SET_HASH_IPPORTNET IP_SET_HASH_IPMAC IP_SET_HASH_MAC \
            IP_SET_HASH_NETPORTNET IP_SET_HASH_NET IP_SET_HASH_NETNET \
            IP_SET_HASH_NETPORT IP_SET_HASH_NETIFACE IP_SET_LIST_SET \
            NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_SET NETFILTER_XT_TARGET_LOG \
            NETFILTER_XT_MATCH_RECENT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE \
            IP_NF_TARGET_REJECT IP6_NF_TARGET_REJECT; do
            set_config "CONFIG_$cfg" y
          done
          set_config CONFIG_IP_SET_MAX 65534
          # Consistent with wild_kernel: hardcode the upper limit in 5.10 source as a fallback if defconfig does not take effect
          if [ "$KVER" = "5.10" ]; then
            sed -i 's/CONFIG_IP_SET_MAX/65534/g' net/netfilter/ipset/ip_set_core.c
          fi

          # TCP congestion control algorithms: default to bbr3 when BBRv3 is patched, otherwise bbr
          for cfg in TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_CUBIC \
            TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP; do
            set_config "CONFIG_$cfg" y
          done
          if [ -n "$BBR3_PATCH" ]; then
            set_config CONFIG_TCP_CONG_BBR3 y
            set_config CONFIG_DEFAULT_BBR3 y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr3"'
          else
            set_config CONFIG_DEFAULT_BBR y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr"'
          fi

          # Traffic shaping Qdisc + connection mark + TTL/HopLimit + WireGuard
          for cfg in NET_SCH_FQ NET_SCH_FQ_CODEL NET_SCH_CAKE NET_ACT_CONNMARK \
            IP_NF_TARGET_TTL IP6_NF_TARGET_HL IP6_NF_MATCH_HL WIREGUARD; do
            set_config "CONFIG_$cfg" y
          done

          # CIFS network filesystem (NETFS_SUPPORT is a hidden symbol selected automatically by Kconfig)
          for cfg in CIFS NETWORK_FILESYSTEMS KEYS CIFS_XATTR CIFS_POSIX; do
            set_config "CONFIG_$cfg" y
          done

          # On 6.12+, remove fs/netfs/netfs.ko from Kleaf GKI module lists once NETFS becomes built-in, otherwise packaging fails
          if [ "$AVER" = "android16" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/build_helpers/cifs_modules_fix.py" "$PWD" fs/netfs/netfs.ko
          fi

          echo "[+] Networking enhancements configured"

      - name: Apply USB Arsenal patches and gadget configs
        if: inputs.use_usb_arsenal
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail
          echo "=== Applying WildKernels USB Arsenal patches ==="

          USB_DIR=/tmp/USB-Arsenal
          for attempt in 1 2 3 4 5; do
            rm -rf "$USB_DIR"
            if git clone --depth 1 https://github.com/ravindu644/USB-Arsenal.git "$USB_DIR"; then
              break
            fi
            [ "$attempt" -eq 5 ] && { echo "::error::Failed to clone USB-Arsenal after 5 attempts" >&2; exit 1; }
            sleep 5
          done

          case "${{ inputs.kernel_version }}" in
            5.10) PATCH_DIR=5.10 ;;
            5.15|6.1) PATCH_DIR=5.15 ;;
            6.6) PATCH_DIR=6.6 ;;
            6.12) PATCH_DIR=6.12 ;;
            *)
              echo "::error::No USB-Arsenal patch set mapped for kernel ${{ inputs.kernel_version }}" >&2
              exit 1
              ;;
          esac

          SRC="$USB_DIR/kernel-patches/$PATCH_DIR"
          CHECK="$GITHUB_WORKSPACE/scripts/build_helpers/usb_arsenal_already_present.py"
          mapfile -t PATCHES < <(find "$SRC" -maxdepth 1 -name '*.patch' | sort)
          [ "${#PATCHES[@]}" -gt 0 ] || { echo "::error::No USB-Arsenal patches found under $SRC" >&2; exit 1; }

          APPLIED=0
          SKIPPED=0
          FAILED=()
          for p in "${PATCHES[@]}"; do
            name="$(basename "$p")"
            if patch -p1 --forward --dry-run -f < "$p" >/dev/null 2>&1; then
              patch -p1 --forward -f < "$p" >/dev/null
              APPLIED=$((APPLIED + 1))
              echo "  applied: $name"
            elif python3 "$CHECK" "$p"; then
              SKIPPED=$((SKIPPED + 1))
              echo "  skipped (already in tree): $name"
            else
              FAILED+=("$name")
              echo "::warning::USB-Arsenal patch did not apply cleanly: $name"
            fi
          done
          echo "USB-Arsenal: ${APPLIED} applied, ${SKIPPED} already present, ${#FAILED[@]} skipped"
          if [ "$APPLIED" -eq 0 ] && [ "$SKIPPED" -eq 0 ]; then
            echo "::error::No USB-Arsenal patch applied for ${{ inputs.android_version }}-${{ inputs.kernel_version }}" >&2
            exit 1
          fi

          set_cfg_if_defined() {
            local sym="$1"
            if grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${sym}([[:space:]]|$)" .; then
              sed -i "/^# CONFIG_${sym} is not set$/d; /^CONFIG_${sym}=/d" "$DEFCONFIG"
              echo "CONFIG_${sym}=y" >> "$DEFCONFIG"
            fi
          }
          for sym in USB_CONFIGFS USB_CONFIGFS_MASS_STORAGE USB_CONFIGFS_F_HID USB_CONFIGFS_NCM USB_CONFIGFS_RNDIS IP_NF_NAT IP_NF_TARGET_MASQUERADE; do
            set_cfg_if_defined "$sym"
          done

      - name: Apply GKI ptrace compatibility patch
        if: inputs.use_ptrace
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail
          KERNEL_VERSION="${{ inputs.kernel_version }}"
          if [ "$KERNEL_VERSION" != "5.16" ] && [ "$(printf '%s\n' "$KERNEL_VERSION" "5.16" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
            echo "Applying WildKernels GKI ptrace patch for kernel $KERNEL_VERSION..."
            patch -p1 -F 3 --forward < "$KERNEL_PATCHES/gki_ptrace.patch" || true
          else
            echo "Kernel $KERNEL_VERSION >= 5.16, skipping GKI ptrace patch"
          fi

      - name: Apply WildKernels performance and power optimization patches
        if: inputs.use_perf
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail
          KERNEL_VERSION="${{ inputs.kernel_version }}"
          MIN_VERSION="5.16"

          echo "Applying WildKernels performance & power optimization patch suite..."
          for p in \
            optimized_mem_operations.patch \
            file_struct_8bytes_align.patch \
            reduce_cache_pressure.patch \
            mem_opt_prefetch.patch; do
            patch -p1 --forward < "$KERNEL_PATCHES/common/$p" || true
          done

          if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
            patch -p1 --forward < "$KERNEL_PATCHES/common/optimise_memcmp.patch" || true
          elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
            sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' \
                -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' \
                -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' \
                "$KERNEL_PATCHES/common/optimise_memcmp.patch" | patch -p1 --forward || true
          fi

          for p in \
            minimise_wakeup_time.patch \
            int_sqrt.patch \
            reduce_gc_thread_sleep_time.patch \
            add_timeout_wakelocks_globally.patch \
            f2fs_reduce_congestion.patch \
            reduce_freeze_timeout.patch; do
            patch -p1 --forward < "$KERNEL_PATCHES/common/$p" || true
          done

          if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
            patch -p1 --forward < "$KERNEL_PATCHES/common/clear_page_16bytes_align.patch" || true
          else
            sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' \
              "$KERNEL_PATCHES/common/clear_page_16bytes_align.patch" | patch -p1 -F3 --forward || true
          fi

          WAKEUP_FILE="drivers/base/power/wakeup.c"
          if [ -f "$WAKEUP_FILE" ] && grep -q "^void pm_system_wakeup(void)" "$WAKEUP_FILE"; then
            if sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$WAKEUP_FILE" | grep -F 'suspend_abort_fs_sync();' >/dev/null; then
              sed -i '/^void pm_system_wakeup(void)/,/^}/{/suspend_abort_fs_sync();/d;}' "$WAKEUP_FILE"
            fi
          fi
          for p in \
            avoid_extra_s2idle_wake_attempts.patch \
            disable_cache_hot_buddy.patch \
            f2fs_enlarge_min_fsync_blocks.patch \
            increase_ext4_default_commit_age.patch \
            increase_sk_mem_packets.patch \
            reduce_pci_pme_wakeups.patch \
            silence_irq_cpu_logspam.patch \
            silence_system_logspam.patch; do
            patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/$p" || true
          done
          echo "[+] WildKernels performance & power patches applied"

      - name: Apply module version mismatch bypass
        if: inputs.allow_version_mismatch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail
          if [ -f kernel/module/version.c ]; then
            TARGET_FILE="kernel/module/version.c"
          else
            TARGET_FILE="kernel/module.c"
          fi
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"
          if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -F "return 1;" >/dev/null; then
            echo "::error::Module bypass patch failed: 'return 1;' not found under bad_version: in $TARGET_FILE" >&2
            exit 1
          fi
          echo "[+] Applied module version mismatch bypass to $TARGET_FILE"

      - name: Integrate Re-Kernel
        if: inputs.use_rekernel
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          echo "Integrating Re-Kernel..."
          TMP_REKERNEL=/tmp/rekernel
          rm -rf "$TMP_REKERNEL"
          git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"

          # Sync full split driver source from upstream
          rm -rf common/drivers/rekernel
          mkdir -p common/drivers/rekernel
          cp -a "$TMP_REKERNEL/LKM-Source/." common/drivers/rekernel/

          # Adapt upstream out-of-tree module config into an in-tree built-in driver
          REKERNEL_MAKEFILE="common/drivers/rekernel/Makefile"
          sed -i 's/^obj-m := rekernel\.o$/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$REKERNEL_MAKEFILE"
          grep -qF 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' "$REKERNEL_MAKEFILE" || \
            echo 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' >> "$REKERNEL_MAKEFILE"
          sed -i '/^[[:space:]]*depends on MODULES[[:space:]]*$/d' common/drivers/rekernel/Kconfig

          # Wire into drivers tree
          if ! grep -qF 'source "drivers/rekernel/Kconfig"' common/drivers/Kconfig; then
            sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' common/drivers/Kconfig
          fi
          if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' common/drivers/Makefile; then
            echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> common/drivers/Makefile
          fi

          # Fix header include path for in-tree compilation
          sed -i 's|#include <../android/binder_internal.h>|#include "../android/binder_internal.h"|g' common/drivers/rekernel/rekernel_binder.c
          # Add seq_file.h required by DEFINE_SHOW_ATTRIBUTE in 5.10 binder_internal.h
          grep -qF '#include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c || \
            sed -i '/#include <linux\/kprobes.h>/a #include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c

          # Configure defconfig (idempotent)
          grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"

      - name: Configure kernel options
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          # When KSU is disabled ("Disable KSU"), KernelSU is absent from the source tree; writing CONFIG_KSU would fail Bazel defconfig validation
          if [ "${{ inputs.ksu_mode }}" != "Disable KSU" ]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            KSU_KCONFIG="$KERNEL_ROOT/KernelSU/kernel/Kconfig"
            if [ -f "$KSU_KCONFIG" ] && grep -qE '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_MULTI_MANAGER_SUPPORT([[:space:]]|$)' "$KSU_KCONFIG"; then
              echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=n" >> "$DEFCONFIG"
            fi
            if [ -f "$KSU_KCONFIG" ] && grep -qE '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_TOOLKIT_SUPPORT([[:space:]]|$)' "$KSU_KCONFIG"; then
              echo "CONFIG_KSU_TOOLKIT_SUPPORT=y" >> "$DEFCONFIG"
            fi
            # When SUSFS is disabled ("Disable SUSFS"), explicitly disable built-in SUSFS Kconfig defaults in AweYukiSU
            if ! ${{ inputs.enable_susfs }}; then
              for sym in \
                CONFIG_KSU_SUSFS \
                CONFIG_KSU_SUSFS_SUS_PATH \
                CONFIG_KSU_SUSFS_SUS_MOUNT \
                CONFIG_KSU_SUSFS_SUS_KSTAT \
                CONFIG_KSU_SUSFS_SPOOF_UNAME \
                CONFIG_KSU_SUSFS_ENABLE_LOG \
                CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                CONFIG_KSU_SUSFS_OPEN_REDIRECT \
                CONFIG_KSU_SUSFS_SUS_MAP \
                CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER; do
                if [ -f "$KSU_KCONFIG" ] && grep -qE "^[[:space:]]*(menuconfig|config)[[:space:]]+${sym#CONFIG_}([[:space:]]|$)" "$KSU_KCONFIG"; then
                  echo "${sym}=n" >> "$DEFCONFIG"
                fi
              done
            fi
          fi

          if [ "${{ inputs.ksu_mode }}" != "Disable KSU" ] && [ "${{ inputs.ksu_variant }}" == "AweYukiSU" ]; then
            if [[ "${{ inputs.use_kpm }}" == enabled* ]] || [[ "${{ inputs.use_kpm }}" == patched* ]]; then
              if ! grep -RqsE '^[[:space:]]*config[[:space:]]+KPM([[:space:]]|$)' common KernelSU 2>/dev/null; then
                echo "Error: KPM was requested, but CONFIG_KPM is not declared in the current KernelSU source" >&2
                exit 1
              fi
              echo "CONFIG_KPM=y" >> "$DEFCONFIG"
            fi
          fi

          CURRENT_SUB="${{ inputs.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi
          if [[ "${{ inputs.ksu_mode }}" != "Disable KSU" && "${{ inputs.ksu_variant }}" == "AweYukiSU" && "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && "$CURRENT_SUB" -ge 74 && "$CURRENT_SUB" -le 137 ]]; then
            {
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
            } >> "$DEFCONFIG"
            # Fix 5.15.74~5.15.137: kallsyms_on_each_symbol is compiled only under LIVEPATCH, causing AweYukiSU link failure
            KALLSYMS_C="./common/kernel/kallsyms.c"
            if [ -f "$KALLSYMS_C" ] \
              && grep -qF 'int kallsyms_on_each_symbol' "$KALLSYMS_C" \
              && grep -qF '#endif /* CONFIG_LIVEPATCH */' "$KALLSYMS_C"; then
              sed -i '/^#ifdef CONFIG_LIVEPATCH$/,/^int kallsyms_on_each_symbol/ { /^#ifdef CONFIG_LIVEPATCH$/d }' "$KALLSYMS_C"
              sed -i '/^int kallsyms_on_each_symbol/,/^#endif \/\* CONFIG_LIVEPATCH \*\// { /^#endif \/\* CONFIG_LIVEPATCH \*\//d }' "$KALLSYMS_C"
              echo "Fixed LIVEPATCH guard around kallsyms_on_each_symbol"
            fi
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Add SUSFS configuration
        if: inputs.enable_susfs
        run: |
          SUSFS_CONFIGS=(
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          # Clean up options managed by this step to prevent duplicates or unsupported leftovers on re-runs.
          for SYMBOL in "${SUSFS_CONFIGS[@]}" CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER; do
            sed -i "/^[[:space:]]*${SYMBOL}=/d; /^[[:space:]]*# ${SYMBOL} is not set$/d" "$DEFCONFIG"
          done

          # AweYukiSU may not declare this option; writing it when absent would fail Bazel defconfig validation.
          KSU_KCONFIG="$KERNEL_ROOT/KernelSU/kernel/Kconfig"
          if [ -f "$KSU_KCONFIG" ] \
            && grep -qE '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_SUSFS_PRIORITY_UID_FILTER([[:space:]]|$)' "$KSU_KCONFIG"; then
            SUSFS_CONFIGS+=(CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER)
          else
            echo "Current KernelSU does not declare CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER, skipping"
          fi

          LINES_BEFORE=$(wc -l < "$DEFCONFIG")
          printf '%s=y\n' "${SUSFS_CONFIGS[@]}" >> "$DEFCONFIG"

          # Export lines appended in this step as a config fragment distributed alongside the integrated SUSFS patch
          if [ "$SUSFS_PATCH_EXPORT" = "true" ] && [ -d "$GITHUB_WORKSPACE/susfs-patch" ]; then
            tail -n +$((LINES_BEFORE + 1)) "$DEFCONFIG" > "$GITHUB_WORKSPACE/susfs-patch/susfs.config"
            echo "Exported SUSFS config fragment: $(wc -l < "$GITHUB_WORKSPACE/susfs-patch/susfs.config") lines"
          fi

      - name: Configure kernel localversion
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./common/BUILD.bazel
            perl -pi -e 's/^\s*protected_module_names_list\s*=\s*":[A-Za-z0-9_]*_protected_module_names",\s*$//;' ./common/BUILD.bazel
            sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
            if [ -f ./common/modules.bzl ] && grep -q '^[[:space:]]*protected_modules = ' ./common/modules.bzl; then
              sed -i 's/protected_modules = \[.*\]/protected_modules = []/' ./common/modules.bzl
            fi
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
            sed -i 's/-dirty//' ./common/scripts/setlocalversion 2>/dev/null || true
          fi

          VERSION_INPUT=$(echo "${{ inputs.version }}" | tr -d '[:space:]')
          if [ -n "$VERSION_INPUT" ]; then
            CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
          else
            GHASH=$(git -C ./common rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")
            CLEAN_VERSION="-AweYuki-Project_${GHASH}"
          fi
          if [ -n "$CLEAN_VERSION" ] && [[ "$CLEAN_VERSION" != -* ]]; then
            CLEAN_VERSION="-${CLEAN_VERSION}"
          fi
          echo "Using kernel localversion suffix: ${CLEAN_VERSION}"
          perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
          sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
          sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig

      - name: Set custom build timestamp
        shell: bash
        env:
          INPUT_TIME: ${{ inputs.build_time }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
            if [[ ! "$INPUT_TIME" =~ $TIME_REGEX ]]; then
              echo "::error title=Invalid Build Time Format::Custom build time must match 'Sun Dec 01 08:10:00 UTC 2024' (remove extra prefixes and use a two-digit day)."
              exit 1
            fi

            NORMALIZED_TIME="$(LC_ALL=C TZ=UTC date -u -d "$INPUT_TIME" +'%a %b %d %T UTC %Y' 2>/dev/null || true)"
            if [[ "$NORMALIZED_TIME" != "$INPUT_TIME" ]]; then
              echo "::error title=Invalid Build Time::Custom build time cannot be parsed as a valid UTC date or weekday does not match the calendar date."
              exit 1
            fi

            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi

          echo "Using build time: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Patch mkcompile_h uniformly
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
              echo "Applying 5.x timestamp patch: $f"
              perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              echo "Applying 6.x mkcompile_h patch: $f"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          fi

      - name: Compile kernel
        id: compile_kernel
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            LOG_DIR="$GITHUB_WORKSPACE/build-logs"
            ATTEMPT_FILE="$LOG_DIR/.compile-attempt"
            mkdir -p "$LOG_DIR"

            # Create an isolated log file for each retry attempt
            ATTEMPT=1
            if [ -s "$ATTEMPT_FILE" ]; then
              read -r LAST_ATTEMPT < "$ATTEMPT_FILE"
              if [[ "$LAST_ATTEMPT" =~ ^[0-9]+$ ]]; then
                ATTEMPT=$((LAST_ATTEMPT + 1))
              fi
            fi
            echo "$ATTEMPT" > "$ATTEMPT_FILE"
            LOG_FILE="$LOG_DIR/compile-attempt-${ATTEMPT}.log"

            set -o pipefail
            {
              echo "Compile attempt: $ATTEMPT"
              echo "Start time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Latest KSU commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Latest SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE:-disabled}"
              set -ex
              cd "$KERNEL_ROOT"

              sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
              sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
              sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

              if [ -f "build/build.sh" ]; then
                LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
                strings "out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" | grep 'Linux version'
              else
                # Extract gki_defconfig changes into a fragment so Bazel trim checks do not fail
                FRAG="common/arch/arm64/configs/ksu.fragment"
                diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
                cp "$DEFCONFIG.orig" "$DEFCONFIG"
                echo "=== KSU Fragment Contents ==="
                cat "$FRAG"
                echo "========================="
                FRAG_FLAG=""
                if [ -s "$FRAG" ]; then
                  FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
                fi
                LTO_FLAG="--lto=thin"
                if [ "${{ inputs.kernel_version }}" = "6.12" ]; then
                  LTO_FLAG="--lto=none"
                fi
                tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
                strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
              fi

              echo "Latest KSU commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Latest SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE:-disabled}"
              echo "Note: large drift between KSU and SUSFS commit dates may cause patch mismatches and build failures"
            } 2>&1 | tee "$LOG_FILE"

            BUILD_STATUS=${PIPESTATUS[0]}
            {
              echo "End time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Exit code: $BUILD_STATUS"
            } >> "$LOG_FILE"
            exit "$BUILD_STATUS"

      - name: Collect failed build logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        env:
          COMPILE_ATTEMPTS: ${{ steps.compile_kernel.outputs.total_attempts }}
          COMPILE_EXIT_CODE: ${{ steps.compile_kernel.outputs.exit_code }}
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"

          {
            echo "Android Version: ${{ inputs.android_version }}"
            echo "Kernel Version: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
            echo "OS Patch Level: ${{ inputs.os_patch_level }}"
            echo "KernelSU Variant: ${{ inputs.ksu_variant }}"
            echo "Config Name: ${CONFIG:-unknown}"
            echo "Git Commit: $GITHUB_SHA"
            echo "Workflow Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Compile Attempts: ${COMPILE_ATTEMPTS:-unknown}"
            echo "Final Exit Code: ${COMPILE_EXIT_CODE:-unknown}"
            echo "KSU Commit Date: ${KSU_LATEST_COMMIT_DATE:-unknown}"
            echo "SUSFS Commit Date: ${SUSFS_LATEST_COMMIT_DATE:-unknown}"
          } > "$LOG_DIR/summary.txt"

          printf '%s\n' "${{ inputs.ksu_variant }}_kernel-${CONFIG}-Build-Logs" > "$LOG_DIR/artifact-name.txt"

          df -h "$GITHUB_WORKSPACE" > "$LOG_DIR/disk-usage.txt" 2>&1 || true
          ccache -s > "$LOG_DIR/ccache-stats.txt" 2>&1 || true

      - name: Upload failed build logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      # - name: Apply KPM patch (AweYukiSU)
      #   if: startsWith(inputs.use_kpm, 'patched') && inputs.ksu_variant == 'AweYukiSU'
      #   run: |
      #     case "${{ inputs.android_version }}" in
      #       "android12"|"android13")
      #         if [ "${{ inputs.kernel_version }}" != "6.6" ]; then
      #           TARGET_PATH="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
      #         fi
      #         ;;
      #       "android14"|"android15"|"android16")
      #         TARGET_PATH="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/"
      #         ;;
      #     esac

      #     cp -r $SUKISU_PATCHES/kpm/patch_linux "$TARGET_PATH/patch"
      #     cd "$TARGET_PATH"
      #     chmod 777 patch
      #     ./patch
      #     rm -rf Image
      #     mv oImage Image

      - name: Prepare boot images
        run: |
          mkdir -p bootimgs

          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          cp "$SRC_DIR/Image" ./bootimgs/
          cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      - name: Create AnyKernel3 archive
        if: inputs.artifact_upload_mode == 'Upload All'
        run: |
          cd "$ANYKERNEL3"
          ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      - name: Stage AnyKernel3 directory
        if: inputs.artifact_upload_mode != 'Upload All'
        run: |
          mv ./Image "$ANYKERNEL3/Image"

      - name: Build boot images (Android 12)
        if: inputs.android_version == 'android12'
        working-directory: bootimgs
        run: |
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          if [ "$status" = "200" ]; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi

          unzip gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Build boot images (Android 13+)
        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' || inputs.android_version == 'android16'
        working-directory: bootimgs
        run: |
          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Collect patch reject files
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          # Skip upstream .rej files: upstream branches may include committed .rej files
          # (e.g., mm/rmap.c.rej in android15-6.6-2026-04), which are not conflicts from our patches;
          # failed patches overwrite same-named files, so skip only files "tracked by git and unmodified".
          mapfile -t REJS < <(
            find "$KERNEL_ROOT" -type f -name '*.rej' | sort | while IFS= read -r rej; do
              if git -C "$(dirname "$rej")" ls-files --error-unmatch -- "$(basename "$rej")" >/dev/null 2>&1 \
                && git -C "$(dirname "$rej")" diff --quiet -- "$(basename "$rej")" 2>/dev/null; then
                echo "Skipping upstream .rej: ${rej#"$KERNEL_ROOT"/}" >&2
                continue
              fi
              echo "$rej"
            done
          )
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej file(s)"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # Artifact name omits the _kernel- prefix so release kernel artifact globs do not match patch archives
      - name: Upload integrated SUSFS patch
        if: success() && env.SUSFS_PATCH_EXPORT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SUSFS-Patch-${{ inputs.ksu_variant }}-${{ env.CONFIG }}-${{ inputs.os_patch_level }}
          path: susfs-patch/
          if-no-files-found: warn
          compression-level: 9

      - name: Upload AnyKernel3 package
        if: inputs.artifact_upload_mode != 'Upload All'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-AnyKernel3
          path: AnyKernel3/*
          compression-level: 9

      - name: Upload all build artifacts
        if: inputs.artifact_upload_mode == 'Upload All'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
            *.img
          compression-level: 9

      - name: Upload patch reject files
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
