name: Kernel Build Pipeline

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== Basic Configuration ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU Configuration ====================
      ksu_variant:
        required: false
        type: string
        default: AweYukiSU
      ksu_mode:
        required: false
        type: string
        default: "Off"

      # ==================== Optional Configuration ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
        default: "r1"
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Feature Toggles ====================
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: true
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload All"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      use_usb_arsenal:
        required: false
        type: boolean
        default: false
      use_ptrace:
        required: false
        type: boolean
        default: false
      use_perf:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Build configuration summary
        run: |
          echo "========================================"
          echo "     Kernel Build Configuration Summary"
          echo "========================================"
          echo "Android Version     : ${{ inputs.android_version }}"
          echo "Kernel Version      : ${{ inputs.kernel_version }}"
          echo "Sublevel            : ${{ inputs.sub_level }}"
          echo "OS Patch Level      : ${{ inputs.os_patch_level }}"
          echo "KSU Variant         : ${{ inputs.ksu_variant }}"
          echo "Build Time          : ${{ inputs.build_time }}"
          echo "SUSFS Enabled       : ${{ inputs.enable_susfs }}"
          echo "ZRAM Enhancement    : ${{ inputs.use_zram }}"
          echo "BBG Patch           : ${{ inputs.use_bbg }}"
          echo "Re-Kernel           : ${{ inputs.use_rekernel }}"
          echo "NoMount             : ${{ inputs.use_nomount }}"
          echo "Networking          : ${{ inputs.use_networking }}"
          echo "USB Arsenal         : ${{ inputs.use_usb_arsenal }}"
          echo "Ptrace Patch        : ${{ inputs.use_ptrace }}"
          echo "Performance Patches : ${{ inputs.use_perf }}"
          echo "Module Bypass       : ${{ inputs.allow_version_mismatch }}"
          echo "CVE-2026-43499      : ${{ inputs.cve_2026_43499_patch }}"
          echo "Export SUSFS Patches: ${{ inputs.export_susfs_patches }}"
          echo "Droidspaces         : ${{ inputs.droidspaces }}"
          echo "NTSync              : ${{ inputs.droidspaces_ntsync }}"
          echo "Artifact Upload Mode: ${{ inputs.artifact_upload_mode }}"
          echo "Stock Config        : Auto-detect config/stock_defconfig"
          echo "========================================"

      - name: Free up disk space
        run: |
          # Move directories in parallel to a temp folder first (near-instant), then delete in the background at low priority without blocking subsequent steps.
          # The temp directory must be outside the workspace: checkout cleans the workspace as the runner user
          # and would fail with EACCES on root-owned files moved in via sudo mv.
          TRASH_DIR=/tmp/.background_trash
          sudo rm -rf "$TRASH_DIR"
          mkdir -p "$TRASH_DIR"/{1..17}

          safe_mv() {
            [ -e "$1" ] && sudo mv "$1" "$2" || true
          }
          export -f safe_mv

          safe_mv /usr/share/dotnet         "$TRASH_DIR"/1  &
          safe_mv /usr/local/lib/android    "$TRASH_DIR"/2  &
          safe_mv /opt/ghc                  "$TRASH_DIR"/3  &
          safe_mv /opt/hostedtoolcache/CodeQL "$TRASH_DIR"/4 &
          safe_mv /usr/local/aws-sam-cli    "$TRASH_DIR"/5  &
          safe_mv /usr/local/share/chromium "$TRASH_DIR"/6  &
          safe_mv /usr/local/share/powershell "$TRASH_DIR"/7 &
          safe_mv /usr/local/lib/heroku     "$TRASH_DIR"/8  &
          safe_mv /usr/local/lib/node_modules "$TRASH_DIR"/9 &
          safe_mv /opt/az                   "$TRASH_DIR"/10 &
          safe_mv /opt/microsoft/powershell "$TRASH_DIR"/11 &
          safe_mv /opt/hostedtoolcache/go   "$TRASH_DIR"/12 &
          safe_mv /opt/hostedtoolcache/PyPy "$TRASH_DIR"/13 &
          safe_mv /opt/hostedtoolcache/node "$TRASH_DIR"/14 &
          sudo bash -c "mv /usr/local/bin/aliyun /usr/local/bin/azcopy /usr/local/bin/bicep \
            /usr/local/bin/cmake-gui /usr/local/bin/cpack /usr/local/bin/helm \
            /usr/local/bin/hub /usr/local/bin/kubectl /usr/local/bin/minikube \
            /usr/local/bin/node /usr/local/bin/packer /usr/local/bin/sam \
            /usr/local/bin/stack /usr/local/bin/terraform /usr/local/bin/oc \
            $TRASH_DIR/15 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/julia* $TRASH_DIR/16 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/bin/pulumi* $TRASH_DIR/17 2>/dev/null || true" &
          wait

          # Delete at low priority in the background while also cleaning up browser packages and apt cache
          (
            sudo nice -n 19 ionice -c 3 rm -rf "$TRASH_DIR"
            sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable \
              >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            sudo apt-get clean >/dev/null 2>&1 || true
            command -v docker >/dev/null 2>&1 && \
              docker rmi $(docker images -q) 2>/dev/null || true
          ) >/dev/null 2>&1 &
          disown

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize build environment
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux_musl-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/boot_sign_key.pem
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          # storage.googleapis.com occasionally fails TLS handshakes (curl exit code 35); across 80+ matrix
          # jobs in a full build, hitting it is not uncommon. --retry-all-errors retries handshake errors,
          # and -f prevents HTTP error pages from being saved as the repo script.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: Display configuration
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Loading configuration file: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves lld llvm bc rsync cpio kmod lz4 zstd jq zip unzip

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=4G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # Only 6.1+ uses Bazel; persist --disk_cache to speed up subsequent builds
      - name: Restore Bazel disk cache
        if: inputs.android_version != 'android12' && inputs.android_version != 'android13'
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-main-kernel-2026-v2

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2026

          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::Toolchain fetch attempt $attempt/5 failed: $*"
              sleep $((5 * attempt))
            done
            return 1
          }

          rm -rf kernel-build-tools mkbootimg
          retry git clone --filter=blob:none --sparse --depth 1 -b "$BRANCH" \
            "$AOSP_MIRROR/kernel/prebuilts/build-tools" kernel-build-tools
          git -C kernel-build-tools sparse-checkout set linux_musl-x86/bin linux_musl-x86/lib64
          rm -rf kernel-build-tools/.git

          retry git clone --depth 1 -b "$BRANCH" \
            "$AOSP_MIRROR/platform/system/tools/mkbootimg" mkbootimg
          rm -rf mkbootimg/.git
          chmod +x kernel-build-tools/linux_musl-x86/bin/avbtool mkbootimg/mkbootimg.py mkbootimg/unpack_bootimg.py

      - name: Generate signing key
        run: |
          chmod +x "$AVBTOOL" "$MKBOOTIMG" "$UNPACK_BOOTIMG"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > "$BOOT_SIGN_KEY_PATH"

      - name: Configure Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      - name: Clone dependency repositories
        run: |
          # Dependency clones may hit transient network errors; use exponential backoff with random jitter so matrix jobs do not retry simultaneously.
          # Clean the destination directory before each attempt so partial leftovers do not break retries.
          clone_with_retry() {
            local repository="$1" destination="$2"
            shift 2
            local attempt delay rc=1
            for attempt in 1 2 3 4 5; do
              echo "Cloning $repository (attempt $attempt/5)..."
              rm -rf -- "$destination" || return 1
              if git clone "$repository" "$destination" "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((15 * (1 << (attempt - 1)) + RANDOM % 10))
                echo "::warning::Failed to clone $repository (exit code $rc), retrying in ${delay}s"
                sleep "$delay" || return 1
              fi
            done
            rm -rf -- "$destination" || return 1
            echo "Failed to clone $repository after 5 attempts (exit code $rc)" >&2
            return "$rc"
          }

          ANYKERNEL_BRANCH="gki-2.0"

          echo "Cloning AnyKernel3..."
          clone_with_retry https://github.com/WildKernels/AnyKernel3.git AnyKernel3 -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "Preparing patch repositories..."
          clone_with_retry https://github.com/WildKernels/kernel_patches.git kernel_patches
          clone_with_retry https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch
          echo "Using current repository patch directory: $ZZH_PATCHES"
          clone_with_retry https://github.com/Numbersf/Action-Build.git Action-Build --depth=1

      - name: Initialize and sync kernel source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          MAX_ATTEMPTS=5
          RETRY_DELAYS=(15 30 60 120 240)
          SYNC_TIMEOUT=20m

          # Abort zero-progress stalls (<1 KB/s for 60s) via git env-config inherited by repo's child git processes
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.lowSpeedLimit
          export GIT_CONFIG_VALUE_0=1024
          export GIT_CONFIG_KEY_1=http.lowSpeedTime
          export GIT_CONFIG_VALUE_1=60

          # android.googlesource.com occasionally rate-limits, resets connections, or stalls on a single project;
          # a single failure does not mean the branch is broken, and retrying the round usually succeeds.
          init_repo() {
            $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} --repo-rev=v2.74 || return 1

            # ls-remote can also fail transiently; an empty output on failure would misclassify deprecated/deleted branches,
            # so retry on non-zero exit codes and restart the round if all attempts fail rather than wasting a sync.
            local ok=false
            for _ in 1 2 3; do
              if REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH}); then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "git ls-remote failed for ${FORMATTED_BRANCH}"
              return 1
            fi

            DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
            TAG_FALLBACK=""
            if grep -q deprecated <<< "$REMOTE_BRANCH"; then
              echo "Detected deprecated branch: $FORMATTED_BRANCH"
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
            elif [ -z "$REMOTE_BRANCH" ]; then
              # Google eventually deletes expired monthly branches altogether (neither active nor under deprecated/),
              # while the manifest still references the branch. Release tags are preserved, so fall back to the highest _rN tag.
              # Must use the full refs/tags/ path; a bare tag name would be looked up under refs/heads/ by repo.
              local latest_tag
              latest_tag=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null \
                | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' \
                | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
              if [ -z "$latest_tag" ]; then
                echo "::error::Branch ${FORMATTED_BRANCH} has neither an upstream branch nor a release tag"
                return 1
              fi
              echo "Branch ${FORMATTED_BRANCH} was deleted upstream; falling back to release tag: $latest_tag"
              sed -i "/path=\"common\"/ s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${latest_tag}\"|" $DEFAULT_MANIFEST_PATH
              TAG_FALLBACK="$latest_tag"
            fi
          }

          attempt=1
          while :; do
            echo "Attempt $attempt/$MAX_ATTEMPTS to init and sync branch: common-${FORMATTED_BRANCH} (timeout $SYNC_TIMEOUT)"
            df -h "$PWD" | tail -n +2 || true

            rc=0
            if init_repo; then
              # Omit --no-tags when falling back to a release tag so repo fetches tag refs properly.
              SYNC_TAG_FLAGS="--no-tags"
              [ -n "$TAG_FALLBACK" ] && SYNC_TAG_FLAGS=""
              SYNC_FLAGS="-c --current-branch -j16 --jobs-checkout=$(nproc) $SYNC_TAG_FLAGS --no-clone-bundle --retry-fetches=3"
              [ "$attempt" -gt 1 ] && SYNC_FLAGS="$SYNC_FLAGS --force-sync"
              timeout -k 60 "$SYNC_TIMEOUT" $REPO sync $SYNC_FLAGS || rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "Kernel source synced successfully (attempt $attempt)"
                break
              fi
              if [ "$rc" -eq 124 ]; then
                echo "repo sync timed out ($SYNC_TIMEOUT)"
              else
                echo "repo sync failed with exit code $rc"
              fi
            else
              rc=1
              echo "repo init or branch precheck failed"
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Kernel source sync failed $MAX_ATTEMPTS times consecutively"
              exit "$rc"
            fi

            # Wipe everything on failed rounds where partial checkouts could poison subsequent syncs
            if [ "$attempt" -ge 2 ]; then
              echo "Cleaning working directory before retry"
              find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi

            RETRY_DELAY="${RETRY_DELAYS[$((attempt - 1))]}"
            echo "Retrying in ${RETRY_DELAY}s..."
            sleep "$RETRY_DELAY"
            attempt=$((attempt + 1))
          done

          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV
          echo "TAG_FALLBACK=$TAG_FALLBACK" >> $GITHUB_ENV

      - name: Apply pre-KSU compatibility & security patches
        uses: ./.github/actions/patch-compat
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sub_level: ${{ inputs.sub_level }}
          cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
          supp_op: ${{ inputs.supp_op }}
          enable_susfs: ${{ inputs.enable_susfs }}

      - name: Determine KernelSU branch
        id: ksu-branch
        if: inputs.ksu_mode != 'Disable KSU'
        run: |
          variant_input="${{ inputs.ksu_variant }}"
          if [ "$variant_input" != "AweYukiSU" ]; then
            echo "Unsupported KernelSU variant: $variant_input (only AweYukiSU is supported)" >&2
            exit 1
          fi

          BRANCH="-s main"

          # Check custom commit configuration
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              AWEYUKISU_COMMIT=$(grep "^aweyukisu=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
              if [ -n "$AWEYUKISU_COMMIT" ]; then
                BRANCH="-s $AWEYUKISU_COMMIT"
                echo "AweYukiSU using custom commit: $AWEYUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU branch: $BRANCH"

      - name: Integrate KernelSU
        if: inputs.ksu_mode != 'Disable KSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "Adding AweYukiSU..."
          curl -LSs "https://raw.githubusercontent.com/AweYuki/AweYukiSU/main/kernel/setup.sh" |
            sed 's|Baka-SU/BakaSU|AweYuki/AweYukiSU|g' |
            bash $BRANCH

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          else
            echo "KSU_LATEST_COMMIT_DATE=unknown" >> $GITHUB_ENV
          fi

      - name: Apply SUSFS patches
        if: inputs.enable_susfs
        uses: ./.github/actions/patch-susfs
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sub_level: ${{ inputs.sub_level }}
          os_patch_level: ${{ inputs.os_patch_level }}
          ksu_variant: ${{ inputs.ksu_variant }}
          ksu_mode: ${{ inputs.ksu_mode }}
          export_susfs_patches: ${{ inputs.export_susfs_patches }}

      - name: Backup baseline defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: Apply optional kernel addons (NoMount / BBG / Re-Kernel)
        if: inputs.use_nomount || inputs.use_bbg || inputs.use_rekernel
        uses: ./.github/actions/patch-addons
        with:
          use_nomount: ${{ inputs.use_nomount }}
          use_bbg: ${{ inputs.use_bbg }}
          use_rekernel: ${{ inputs.use_rekernel }}

      - name: Apply Droidspaces container patches
        if: inputs.droidspaces != 'off'
        uses: ./.github/actions/patch-droidspaces
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          droidspaces: ${{ inputs.droidspaces }}

      - name: Apply NTSync patches and config
        if: inputs.droidspaces_ntsync
        uses: ./.github/actions/patch-ntsync
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply ZRAM LZ4 patch stack and config
        if: inputs.use_zram
        uses: ./.github/actions/patch-zram
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply networking enhancements (BBRv3 / IPSet / Qdisc / CIFS)
        if: inputs.use_networking
        uses: ./.github/actions/patch-networking
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Apply USB Arsenal patches and gadget configs
        if: inputs.use_usb_arsenal
        uses: ./.github/actions/patch-usb-arsenal
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply WildKernels optional patches (Ptrace / Perf / Module bypass)
        if: inputs.use_ptrace || inputs.use_perf || inputs.allow_version_mismatch
        uses: ./.github/actions/patch-wildkernels-misc
        with:
          kernel_version: ${{ inputs.kernel_version }}
          use_ptrace: ${{ inputs.use_ptrace }}
          use_perf: ${{ inputs.use_perf }}
          allow_version_mismatch: ${{ inputs.allow_version_mismatch }}

      - name: Configure kernel options
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          # When KSU is disabled ("Disable KSU"), KernelSU is absent from the source tree; writing CONFIG_KSU would fail Bazel defconfig validation
          if [ "${{ inputs.ksu_mode }}" != "Disable KSU" ]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            KSU_KCONFIG="$KERNEL_ROOT/KernelSU/kernel/Kconfig"
            if [ -f "$KSU_KCONFIG" ] && grep -qE '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_MULTI_MANAGER_SUPPORT([[:space:]]|$)' "$KSU_KCONFIG"; then
              echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=n" >> "$DEFCONFIG"
            fi
            if [ -f "$KSU_KCONFIG" ] && grep -qE '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_TOOLKIT_SUPPORT([[:space:]]|$)' "$KSU_KCONFIG"; then
              echo "CONFIG_KSU_TOOLKIT_SUPPORT=y" >> "$DEFCONFIG"
            fi
            # When SUSFS is disabled ("Disable SUSFS"), explicitly disable built-in SUSFS Kconfig defaults in AweYukiSU
            if ! ${{ inputs.enable_susfs }}; then
              for sym in \
                CONFIG_KSU_SUSFS \
                CONFIG_KSU_SUSFS_SUS_PATH \
                CONFIG_KSU_SUSFS_SUS_MOUNT \
                CONFIG_KSU_SUSFS_SUS_KSTAT \
                CONFIG_KSU_SUSFS_SPOOF_UNAME \
                CONFIG_KSU_SUSFS_ENABLE_LOG \
                CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                CONFIG_KSU_SUSFS_OPEN_REDIRECT \
                CONFIG_KSU_SUSFS_SUS_MAP \
                CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER; do
                if [ -f "$KSU_KCONFIG" ] && grep -qE "^[[:space:]]*(menuconfig|config)[[:space:]]+${sym#CONFIG_}([[:space:]]|$)" "$KSU_KCONFIG"; then
                  echo "${sym}=n" >> "$DEFCONFIG"
                fi
              done
            fi
          fi

          CURRENT_SUB="${{ inputs.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi
          if [[ "${{ inputs.ksu_mode }}" != "Disable KSU" && "${{ inputs.ksu_variant }}" == "AweYukiSU" && "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && "$CURRENT_SUB" -ge 74 && "$CURRENT_SUB" -le 137 ]]; then
            {
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
            } >> "$DEFCONFIG"
            # Fix 5.15.74~5.15.137: kallsyms_on_each_symbol is compiled only under LIVEPATCH, causing AweYukiSU link failure
            KALLSYMS_C="./common/kernel/kallsyms.c"
            if [ -f "$KALLSYMS_C" ] \
              && grep -qF 'int kallsyms_on_each_symbol' "$KALLSYMS_C" \
              && grep -qF '#endif /* CONFIG_LIVEPATCH */' "$KALLSYMS_C"; then
              sed -i '/^#ifdef CONFIG_LIVEPATCH$/,/^int kallsyms_on_each_symbol/ { /^#ifdef CONFIG_LIVEPATCH$/d }' "$KALLSYMS_C"
              sed -i '/^int kallsyms_on_each_symbol/,/^#endif \/\* CONFIG_LIVEPATCH \*\// { /^#endif \/\* CONFIG_LIVEPATCH \*\//d }' "$KALLSYMS_C"
              echo "Fixed LIVEPATCH guard around kallsyms_on_each_symbol"
            fi
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Add SUSFS configuration
        if: inputs.enable_susfs
        run: |
          SUSFS_CONFIGS=(
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          # Clean up options managed by this step to prevent duplicates or unsupported leftovers on re-runs.
          for SYMBOL in "${SUSFS_CONFIGS[@]}" CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER; do
            sed -i "/^[[:space:]]*${SYMBOL}=/d; /^[[:space:]]*# ${SYMBOL} is not set$/d" "$DEFCONFIG"
          done

          # AweYukiSU may not declare this option; writing it when absent would fail Bazel defconfig validation.
          KSU_KCONFIG="$KERNEL_ROOT/KernelSU/kernel/Kconfig"
          if [ -f "$KSU_KCONFIG" ] \
            && grep -qE '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_SUSFS_PRIORITY_UID_FILTER([[:space:]]|$)' "$KSU_KCONFIG"; then
            SUSFS_CONFIGS+=(CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER)
          else
            echo "Current KernelSU does not declare CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER, skipping"
          fi

          LINES_BEFORE=$(wc -l < "$DEFCONFIG")
          printf '%s=y\n' "${SUSFS_CONFIGS[@]}" >> "$DEFCONFIG"

          # Export lines appended in this step as a config fragment distributed alongside the integrated SUSFS patch
          if [ "$SUSFS_PATCH_EXPORT" = "true" ] && [ -d "$GITHUB_WORKSPACE/susfs-patch" ]; then
            tail -n +$((LINES_BEFORE + 1)) "$DEFCONFIG" > "$GITHUB_WORKSPACE/susfs-patch/susfs.config"
            echo "Exported SUSFS config fragment: $(wc -l < "$GITHUB_WORKSPACE/susfs-patch/susfs.config") lines"
          fi

      - name: Configure kernel localversion
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./common/BUILD.bazel
            perl -pi -e 's/^\s*protected_module_names_list\s*=\s*":[A-Za-z0-9_]*_protected_module_names",\s*$//;' ./common/BUILD.bazel
            sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
            if [ -f ./common/modules.bzl ] && grep -q '^[[:space:]]*protected_modules = ' ./common/modules.bzl; then
              sed -i 's/protected_modules = \[.*\]/protected_modules = []/' ./common/modules.bzl
            fi
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
            sed -i 's/-dirty//' ./common/scripts/setlocalversion 2>/dev/null || true
          fi

          VERSION_INPUT=$(echo "${{ inputs.version }}" | tr -d '[:space:]')
          if [ -n "$VERSION_INPUT" ]; then
            CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
          else
            GHASH=$(git -C ./common rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")
            CLEAN_VERSION="-AweYuki-Project-${GHASH}"
          fi
          if [ -n "$CLEAN_VERSION" ] && [[ "$CLEAN_VERSION" != -* ]]; then
            CLEAN_VERSION="-${CLEAN_VERSION}"
          fi
          echo "Using kernel localversion suffix: ${CLEAN_VERSION}"
          perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
          sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
          sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig

      - name: Set custom build timestamp
        shell: bash
        env:
          INPUT_TIME: ${{ inputs.build_time }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
            if [[ ! "$INPUT_TIME" =~ $TIME_REGEX ]]; then
              echo "::error title=Invalid Build Time Format::Custom build time must match 'Sun Dec 01 08:10:00 UTC 2024' (remove extra prefixes and use a two-digit day)."
              exit 1
            fi

            NORMALIZED_TIME="$(LC_ALL=C TZ=UTC date -u -d "$INPUT_TIME" +'%a %b %d %T UTC %Y' 2>/dev/null || true)"
            if [[ "$NORMALIZED_TIME" != "$INPUT_TIME" ]]; then
              echo "::error title=Invalid Build Time::Custom build time cannot be parsed as a valid UTC date or weekday does not match the calendar date."
              exit 1
            fi

            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi

          echo "Using build time: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Patch mkcompile_h uniformly
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
              echo "Applying 5.x timestamp patch: $f"
              perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              echo "Applying 6.x mkcompile_h patch: $f"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          fi

      - name: Compile kernel
        id: compile_kernel
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            LOG_DIR="$GITHUB_WORKSPACE/build-logs"
            ATTEMPT_FILE="$LOG_DIR/.compile-attempt"
            mkdir -p "$LOG_DIR"

            # Create an isolated log file for each retry attempt
            ATTEMPT=1
            if [ -s "$ATTEMPT_FILE" ]; then
              read -r LAST_ATTEMPT < "$ATTEMPT_FILE"
              if [[ "$LAST_ATTEMPT" =~ ^[0-9]+$ ]]; then
                ATTEMPT=$((LAST_ATTEMPT + 1))
              fi
            fi
            echo "$ATTEMPT" > "$ATTEMPT_FILE"
            LOG_FILE="$LOG_DIR/compile-attempt-${ATTEMPT}.log"

            set -o pipefail
            {
              echo "Compile attempt: $ATTEMPT"
              echo "Start time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Latest KSU commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Latest SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE:-disabled}"
              set -ex
              cd "$KERNEL_ROOT"

              sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
              sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
              sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

              if [ -f "build/build.sh" ]; then
                LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
                strings "out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" | grep 'Linux version'
              else
                # Extract gki_defconfig changes into a fragment so Bazel trim checks do not fail
                FRAG="common/arch/arm64/configs/ksu.fragment"
                diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
                cp "$DEFCONFIG.orig" "$DEFCONFIG"
                echo "=== KSU Fragment Contents ==="
                cat "$FRAG"
                echo "========================="
                FRAG_FLAG=""
                if [ -s "$FRAG" ]; then
                  FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
                fi
                LTO_FLAG="--lto=thin"
                if [ "${{ inputs.kernel_version }}" = "6.12" ]; then
                  LTO_FLAG="--lto=none"
                fi
                tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
                strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
              fi

              echo "Latest KSU commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Latest SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE:-disabled}"
              echo "Note: large drift between KSU and SUSFS commit dates may cause patch mismatches and build failures"
            } 2>&1 | tee "$LOG_FILE"

            BUILD_STATUS=${PIPESTATUS[0]}
            {
              echo "End time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Exit code: $BUILD_STATUS"
            } >> "$LOG_FILE"
            exit "$BUILD_STATUS"

      - name: Collect failed build logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        env:
          COMPILE_ATTEMPTS: ${{ steps.compile_kernel.outputs.total_attempts }}
          COMPILE_EXIT_CODE: ${{ steps.compile_kernel.outputs.exit_code }}
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"

          {
            echo "Android Version: ${{ inputs.android_version }}"
            echo "Kernel Version: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
            echo "OS Patch Level: ${{ inputs.os_patch_level }}"
            echo "KernelSU Variant: ${{ inputs.ksu_variant }}"
            echo "Config Name: ${CONFIG:-unknown}"
            echo "Git Commit: $GITHUB_SHA"
            echo "Workflow Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Compile Attempts: ${COMPILE_ATTEMPTS:-unknown}"
            echo "Final Exit Code: ${COMPILE_EXIT_CODE:-unknown}"
            echo "KSU Commit Date: ${KSU_LATEST_COMMIT_DATE:-unknown}"
            echo "SUSFS Commit Date: ${SUSFS_LATEST_COMMIT_DATE:-unknown}"
          } > "$LOG_DIR/summary.txt"

          printf '%s\n' "${{ inputs.ksu_variant }}_kernel-${CONFIG}-Build-Logs" > "$LOG_DIR/artifact-name.txt"

          df -h "$GITHUB_WORKSPACE" > "$LOG_DIR/disk-usage.txt" 2>&1 || true
          ccache -s > "$LOG_DIR/ccache-stats.txt" 2>&1 || true

      - name: Upload failed build logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Prepare boot images
        run: |
          mkdir -p bootimgs

          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          cp "$SRC_DIR/Image" ./bootimgs/
          cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      - name: Create AnyKernel3 archive
        if: inputs.artifact_upload_mode == 'Upload All'
        run: |
          cd "$ANYKERNEL3"
          ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      - name: Stage AnyKernel3 directory
        if: inputs.artifact_upload_mode != 'Upload All'
        run: |
          mv ./Image "$ANYKERNEL3/Image"

      - name: Build boot images (Android 12)
        if: inputs.android_version == 'android12'
        working-directory: bootimgs
        run: |
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          if [ "$status" = "200" ]; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi

          unzip gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Build boot images (Android 13+)
        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' || inputs.android_version == 'android16'
        working-directory: bootimgs
        run: |
          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Collect patch reject files
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          # Skip upstream .rej files: upstream branches may include committed .rej files
          # (e.g., mm/rmap.c.rej in android15-6.6-2026-04), which are not conflicts from our patches;
          # failed patches overwrite same-named files, so skip only files "tracked by git and unmodified".
          mapfile -t REJS < <(
            find "$KERNEL_ROOT" -type f -name '*.rej' | sort | while IFS= read -r rej; do
              if git -C "$(dirname "$rej")" ls-files --error-unmatch -- "$(basename "$rej")" >/dev/null 2>&1 \
                && git -C "$(dirname "$rej")" diff --quiet -- "$(basename "$rej")" 2>/dev/null; then
                echo "Skipping upstream .rej: ${rej#"$KERNEL_ROOT"/}" >&2
                continue
              fi
              echo "$rej"
            done
          )
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej file(s)"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # Artifact name omits the _kernel- prefix so release kernel artifact globs do not match patch archives
      - name: Upload integrated SUSFS patch
        if: success() && env.SUSFS_PATCH_EXPORT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SUSFS-Patch-${{ inputs.ksu_variant }}-${{ env.CONFIG }}-${{ inputs.os_patch_level }}
          path: susfs-patch/
          if-no-files-found: warn
          compression-level: 9

      - name: Upload AnyKernel3 package
        if: inputs.artifact_upload_mode != 'Upload All'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-AnyKernel3
          path: AnyKernel3/*
          compression-level: 9

      - name: Upload all build artifacts
        if: inputs.artifact_upload_mode == 'Upload All'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
            *.img
          compression-level: 9

      - name: Upload patch reject files
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
