name: SUSFS Raw Patch Probe

# This is a stub workflow on the default branch: GitHub only lists workflow_dispatch workflows present on the default branch.
# The actual probe logic lives on the long-lived tool branch `susfs-probe` (same file path). To run it, select
# the `susfs-probe` branch under "Use workflow from" on the Actions page; inputs here must stay in sync with that branch.
# Running this directly on `dev` only prints an error notice and builds nothing.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version (all = all branches)"
        required: true
        type: choice
        options:
          - all
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: all
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - AweYukiSU
        default: AweYukiSU
      sub_level_min:
        description: "Minimum sublevel (empty = no limit)"
        required: false
        type: string
        default: ""
      sub_level_max:
        description: "Maximum sublevel (empty = no limit)"
        required: false
        type: string
        default: ""
      os_patch_levels:
        description: "Only probe these security patch months, comma-separated (empty = all, e.g., 2025-03,2025-07)"
        required: false
        type: string
        default: ""
      include_lts:
        description: "Include LTS branches"
        required: false
        type: boolean
        default: true
      susfs_side_fixes:
        description: "Keep sublevel-independent SUSFS-side fixes (two upstream patch build defects on 5.10)"
        required: false
        type: boolean
        default: false
      susfs_pin_time:
        description: "Pin susfs4ksu to the last commit before this timestamp (ISO 8601, empty = workflow start time)"
        required: false
        type: string
        default: ""
      upload_kernels:
        description: "Upload compiled AnyKernel3 packages (default keeps probe results only)"
        required: false
        type: boolean
        default: false
      max_parallel:
        description: "Maximum parallel jobs"
        required: false
        type: string
        default: "20"
      data_source:
        description: "Source branch for version data and existing probe results"
        required: false
        type: string
        default: dev

jobs:
  notice:
    name: Select susfs-probe branch to run
    runs-on: ubuntu-24.04
    steps:
      - name: Branch notice
        run: |
          echo "::error::This is a stub workflow on dev and does not build anything."
          echo "::error::Please select the 'susfs-probe' branch under 'Use workflow from' in Run workflow before running."
          exit 1
