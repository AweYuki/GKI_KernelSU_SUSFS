name: Update Data & Deploy Pages

on:
  schedule:
    - cron: '0 8 */3 * *'  # Runs every 3 days at 08:00 UTC
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'data/**'
      - 'web/**'
      - 'scripts/**'
      # scripts/susfs_fixes/ and scripts/build_helpers/ contain build-time patch/config helpers called by build.yml, unrelated to version data fetching
      - '!scripts/susfs_fixes/**'
      - '!scripts/build_helpers/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-24.04
    outputs:
      data-changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run incremental update
        working-directory: scripts
        run: |
          # Exit 0 = data changed, 2 = no changes, 1 = real error
          python update_data.py && exit_code=0 || exit_code=$?
          if [ $exit_code -eq 1 ]; then
            echo "::error::update_data.py failed with an error"
            exit 1
          fi

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore: update GKI kernel version data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    if: ${{ github.repository == 'AweYuki/GKI_KernelSU_SUSFS' }}
    needs: update-data
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Pull latest data
        run: git pull origin dev

      - name: Copy data to web directory
        run: cp -r data/ web/data/

      # Build frontend assets (webpack bundles JS/SCSS -> dist/)
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build web assets
        working-directory: web
        run: npm ci && npx webpack --mode production

      # Pages artifact only needs HTML pages, dist/, data/, and assets/; remove node_modules (40MB+) before upload
      - name: Trim Pages artifact
        run: rm -rf web/node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
